# =============================================================
# nginx site config for OC Pixel Adventure
# 部署到你自己的 VPS 上，服务子域 game.mimitu.top
#
# 保存路径示例：/etc/nginx/sites-available/oc-pixel-adventure.conf
# 启用：
#   sudo ln -s /etc/nginx/sites-available/oc-pixel-adventure.conf \
#              /etc/nginx/sites-enabled/oc-pixel-adventure.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
# =============================================================

# HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name game.mimitu.top;

    # certbot 验证需要的临时目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.mimitu.top;

    # ---- SSL：先跑 certbot 生成，路径就是下面这两行 ----
    ssl_certificate     /etc/letsencrypt/live/game.mimitu.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.mimitu.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- 静态站点根目录 ----
    root /var/www/oc-pixel-adventure;
    index index.html;

    # 允许 base64 头像 / 立绘上传，客户端 localStorage 存 → 请求体不会大，但保险起见拉大
    client_max_body_size 20m;

    # 长期缓存 vite hash 过的静态资产
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 字体、图片等常见静态资源
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf|eot|mp3|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 单页应用：路由都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # 允许浏览器直接连向 Gemini / DeepSeek / OpenAI 兼容中转（游戏必须的能力）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;
}
