<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#faf0f2">
    <title>女仆咖啡厅 - 冰淇淋球与拉花工坊</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./three.min.js"></script>
</head>
<body>

    <!-- 3D 画布：始终铺满整个视口（含安全区，装饰可延伸到刘海后面） -->
    <div id="webgl-box"></div>

    <div class="app-shell">

        <!-- 顶部：模式提示 + 快捷按钮 -->
        <header class="top-nav">
            <div class="mode-pill" id="modePill" data-onclick="togglePill()" title="点一下看完整提示">🍨 点一下杯子，放上一颗冰淇淋球</div>

            <!-- 口味色条：决定之后放的冰淇淋球、拉花、彩笔的颜色 -->
            <div class="color-swatch-bar">
                <span class="sub-label">口味:</span>
                <div class="color-dot" data-style="background:#fffcf0;" data-onclick="setGelatoColor('#fffcf0', this)" title="香草白" role="button" aria-label="香草白"></div>
                <div class="color-dot" data-style="background:#ff9ebb;" data-onclick="setGelatoColor('#ff9ebb', this)" title="草莓甜心" role="button" aria-label="草莓甜心"></div>
                <div class="color-dot" data-style="background:#88c278;" data-onclick="setGelatoColor('#88c278', this)" title="宇治抹茶" role="button" aria-label="宇治抹茶"></div>
                <div class="color-dot" data-style="background:#64b5f6;" data-onclick="setGelatoColor('#64b5f6', this)" title="蓝蝶海盐" role="button" aria-label="蓝蝶海盐"></div>
                <div class="color-dot" data-style="background:#ce93d8;" data-onclick="setGelatoColor('#ce93d8', this)" title="香芋浓郁" role="button" aria-label="香芋浓郁"></div>
                <div class="color-dot" data-style="background:#ffd54f;" data-onclick="setGelatoColor('#ffd54f', this)" title="芒果乳酪" role="button" aria-label="芒果乳酪"></div>
            </div>

            <div class="top-btn-group">
                <a class="icon-btn home-btn" href="/" title="回游戏盒子" aria-label="回游戏盒子">🏠</a>
                <button class="icon-btn" id="langBtn" title="切换语言" aria-label="切换语言">🌐</button>
                <button class="icon-btn" data-onclick="toggleCamPresets()" title="切换相机机位" aria-label="切换相机机位">🎥</button>
                <button class="icon-btn" data-onclick="togglePalette()" title="换桌布颜色" aria-label="换桌布颜色">🎨</button>
                <button class="icon-btn" data-style="background:#ff4d6d;color:#fff;" data-onclick="toggleBubble()" title="女仆提示" aria-label="女仆提示">🐱</button>
            </div>

            <!-- 视角预设菜单 -->
            <div class="cam-preset-pop" id="camPresetPop">
                <button class="cam-btn" data-onclick="setCamPreset('BARISTA')">📐 45° 咖啡师视角</button>
                <button class="cam-btn" data-onclick="setCamPreset('SIDE')">☕ 侧面平视冰淇淋球</button>
                <button class="cam-btn" data-onclick="setCamPreset('TOP')">👀 正上俯视全览</button>
            </div>

            <!-- 桌布颜色快捷切换面板 -->
            <div class="color-palette-pop" id="colorPalette">
                <button class="color-opt" data-style="background:#ffe5ec;color:#c9184a;" data-onclick="changeTableColor('pink')">🌸 樱花粉格纹桌布</button>
                <button class="color-opt" data-style="background:#e8f5e9;color:#2e7d32;" data-onclick="changeTableColor('mint')">🌿 薄荷绿格纹桌布</button>
                <button class="color-opt" data-style="background:#f3e8ff;color:#7e22ce;" data-onclick="changeTableColor('purple')">💜 薰衣草紫格桌布</button>
                <button class="color-opt" data-style="background:#fff7ed;color:#c2410c;" data-onclick="changeTableColor('orange')">🍋 蜜糖柠檬黄桌布</button>
                <button class="color-opt" data-style="background:#f5ebe0;color:#78350f;" data-onclick="changeTableColor('wood')">☕ 复古焦糖木纹桌面</button>
            </div>

            <!-- 语言切换面板 -->
            <div class="lang-pop" id="langPop">
                <button class="cam-btn lang-opt" data-lang="system">跟随系统</button>
                <button class="cam-btn lang-opt" data-lang="zh">中文</button>
                <button class="cam-btn lang-opt" data-lang="en">English</button>
            </div>
        </header>

        <!-- 中部：画布上方的悬浮信息区 -->
        <div class="stage">
            <div class="hud-top">
                <!-- 幅度：1 最细最慢，10 最粗最快 -->
                <div class="size-bar" id="sizeBar">
                    <span class="sub-label">幅度</span>
                    <input type="range" id="sizeRange" min="1" max="10" step="1" value="3" data-oninput="setBrushLevel(this.value)" aria-label="幅度">
                    <span class="sub-label" id="sizeVal" data-i18n-skip>3</span>
                </div>

                <!-- 道具角度：朝向 -180°~180°，倾斜 -35°~35° -->
                <div class="size-bar angle-bar" id="angleBar">
                    <span class="sub-label">朝向</span>
                    <input type="range" id="yawRange" min="-180" max="180" step="5" value="0" data-oninput="setToolYaw(this.value)" aria-label="朝向">
                    <span class="sub-label">倾斜</span>
                    <input type="range" id="tiltRange" min="-35" max="35" step="5" value="0" data-oninput="setToolTilt(this.value)" aria-label="倾斜">
                </div>

                <div class="maid-bubble" id="maidBubble">主人！先点一下杯子，放上第一颗冰淇淋球吧~ 每颗都可以选不同的口味哦 🍨✨</div>
            </div>




            <!-- 缩放 -->
            <div class="zoom-ctrl">
                <button class="icon-btn" data-onclick="zoomBy(0.85)" title="拉近" aria-label="拉近">➕</button>
                <button class="icon-btn" data-onclick="zoomBy(1.18)" title="拉远" aria-label="拉远">➖</button>
            </div>
        </div>

        <!-- 底部：工具坞（安全区由这一层统管，滚动内容不再重复加内边距） -->
        <div class="bottom-dock">
            <div class="dock-bars">
                <!-- 冰淇淋形状和大小（仅放冰淇淋模式显示） -->
                <div class="sub-bar" id="shapeBar">
                    <span class="sub-label">形状</span>
                    <button class="deco-btn shape-btn active" data-onclick="setShape('ball', this)">⚪ 圆球</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('flat', this)">🥞 扁圆</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('cube', this)">🧊 方块</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('heart', this)">💗 爱心</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('star', this)">⭐ 星星</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('cat', this)">🐱 猫头</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('drop', this)">💧 水滴</button>
                    <button class="deco-btn shape-btn" data-onclick="setShape('swirl', this)">🍦 甜筒</button>
                    <span class="sub-label">大小</span>
                    <button class="deco-btn size-btn" data-onclick="setScoopSize(0.7, this)">小</button>
                    <button class="deco-btn size-btn active" data-onclick="setScoopSize(1, this)">中</button>
                    <button class="deco-btn size-btn" data-onclick="setScoopSize(1.35, this)">大</button>
                </div>

                <!-- 橡皮泥手法（仅橡皮泥模式显示） -->
                <div class="sub-bar" id="clayBar">
                    <span class="sub-label">手法</span>
                    <button class="deco-btn active" data-onclick="setClayMode('push', this)">👉 推</button>
                    <button class="deco-btn" data-onclick="setClayMode('squeeze', this)">🤲 挤</button>
                    <button class="deco-btn" data-onclick="setClayMode('poke', this)">☝️ 戳</button>
                    <button class="deco-btn" data-onclick="setClayMode('smooth', this)">🫳 抹</button>
                </div>

                <!-- 捏的方式（仅捏起来模式显示） -->
                <div class="sub-bar" id="pinchBar">
                    <span class="sub-label">捏</span>
                    <button class="deco-btn active" data-onclick="setPinchMode('peak', this)">🫳 捏出尖角</button>
                    <button class="deco-btn" data-onclick="setPinchMode('move', this)">✋ 挪动冰淇淋球</button>
                </div>

                <!-- 颜色（描边彩笔 / 画杯子模式显示） -->
                <div class="sub-bar" id="penBar">
                    <span class="sub-label">颜色</span>
                    <button class="pen-dot active" data-style="background:#e8334a;" data-onclick="setPenColor('#e8334a', this)" title="草莓红" aria-label="草莓红"></button>
                    <button class="pen-dot" data-style="background:#ffc400;" data-onclick="setPenColor('#ffc400', this)" title="柠檬黄" aria-label="柠檬黄"></button>
                    <button class="pen-dot" data-style="background:#3fa34d;" data-onclick="setPenColor('#3fa34d', this)" title="抹茶绿" aria-label="抹茶绿"></button>
                    <button class="pen-dot" data-style="background:#2f8fe0;" data-onclick="setPenColor('#2f8fe0', this)" title="蓝莓蓝" aria-label="蓝莓蓝"></button>
                    <button class="pen-dot" data-style="background:#9b59d0;" data-onclick="setPenColor('#9b59d0', this)" title="紫薯紫" aria-label="紫薯紫"></button>
                    <button class="pen-dot" data-style="background:#ff7eb6;" data-onclick="setPenColor('#ff7eb6', this)" title="樱花粉" aria-label="樱花粉"></button>
                    <button class="pen-dot" data-style="background:#ffffff;" data-onclick="setPenColor('#ffffff', this)" title="奶白" aria-label="奶白"></button>
                    <button class="pen-dot" data-style="background:#3b1d0e;" data-onclick="setPenColor('#3b1d0e', this)" title="巧克力" aria-label="巧克力"></button>
                    <span class="stamp-chips" id="stampChips"></span>
                </div>

                <!-- 小装饰选择（仅小装饰模式显示） -->
                <div class="sub-bar" id="decoBar">
                    <button class="deco-btn active" data-onclick="setDecoType('lemon', this)">🍋 柠檬片</button>
                    <button class="deco-btn" data-onclick="setDecoType('strawberry', this)">🍓 草莓</button>
                    <button class="deco-btn" data-onclick="setDecoType('cherry', this)">🍒 樱桃</button>
                    <button class="deco-btn" data-onclick="setDecoType('mint', this)">🌿 薄荷叶</button>
                    <button class="deco-btn" data-onclick="setDecoType('cookie', this)">🍪 饼干</button>
                    <button class="deco-btn" data-onclick="setDecoType('chips', this)">🍫 巧克力碎</button>
                    <button class="deco-btn" data-onclick="setDecoType('blueberry', this)">🫐 蓝莓</button>
                    <button class="deco-btn" data-onclick="setDecoType('marshmallow', this)">☁️ 棉花糖</button>
                    <button class="deco-btn" data-onclick="setDecoType('starcandy', this)">⭐ 糖霜星星</button>
                    <button class="deco-btn" data-onclick="setDecoType('wafer', this)">🥨 威化卷</button>
                    <button class="deco-btn deco-upload" data-onclick="pickAsset()">📷 上传图片</button>
                    <input type="file" id="assetInput" accept="image/*" multiple hidden>
                </div>
            </div>

            <!-- 雕琢台：转台在杯子旁边；这里像拼贴一样选角色、五官，还能揉捏、上色，拼好再贴到咖啡上 -->
            <div class="sculpt-sheet" id="sculptSheet">
                <div class="sheet-row slot-tabs">
                    <button class="deco-btn slot-tab on" data-slot="base" data-onclick="setSculptSlot('base')">角色</button>
                    <button class="deco-btn slot-tab" data-slot="eyes" data-onclick="setSculptSlot('eyes')">眼睛</button>
                    <button class="deco-btn slot-tab" data-slot="mouth" data-onclick="setSculptSlot('mouth')">嘴巴</button>
                    <button class="deco-btn slot-tab" data-slot="hair" data-onclick="setSculptSlot('hair')">头发</button>
                    <button class="deco-btn slot-tab" data-slot="arms" data-onclick="setSculptSlot('arms')">手</button>
                    <button class="deco-btn slot-tab" data-slot="acc" data-onclick="setSculptSlot('acc')">配饰</button>
                    <button class="deco-btn slot-tab" data-slot="clay" data-onclick="setSculptSlot('clay')">揉捏</button>
                    <button class="deco-btn slot-tab" data-slot="paint" data-onclick="setSculptSlot('paint')">上色</button>
                </div>
                <div class="sheet-row look-group active" data-group="base">
                    <button class="deco-btn look-btn" data-look="base:cat" data-onclick="setSculptLook('base','cat')">🐱 猫咪</button>
                    <button class="deco-btn look-btn" data-look="base:bear" data-onclick="setSculptLook('base','bear')">🐻 小熊</button>
                    <button class="deco-btn look-btn" data-look="base:person" data-onclick="setSculptLook('base','person')">🧍 小人</button>
                    <button class="deco-btn look-btn" data-look="base:bunny" data-onclick="setSculptLook('base','bunny')">🐰 兔子</button>
                    <button class="deco-btn look-btn" data-look="base:penguin" data-onclick="setSculptLook('base','penguin')">🐧 企鹅</button>
                    <button class="deco-btn look-btn" data-look="base:dino" data-onclick="setSculptLook('base','dino')">🦖 恐龙</button>
                </div>
                <div class="sheet-row look-group" data-group="eyes">
                    <button class="deco-btn look-btn" data-look="eyes:dot" data-onclick="setSculptLook('eyes','dot')">● 圆眼</button>
                    <button class="deco-btn look-btn" data-look="eyes:happy" data-onclick="setSculptLook('eyes','happy')">︶ 笑眼</button>
                    <button class="deco-btn look-btn" data-look="eyes:star" data-onclick="setSculptLook('eyes','star')">★ 星星眼</button>
                    <button class="deco-btn look-btn" data-look="eyes:closed" data-onclick="setSculptLook('eyes','closed')">— 眯眼</button>
                    <button class="deco-btn look-btn" data-look="eyes:heart" data-onclick="setSculptLook('eyes','heart')">♥ 爱心眼</button>
                    <button class="deco-btn look-btn" data-look="eyes:wink" data-onclick="setSculptLook('eyes','wink')">◡ 眨眼</button>
                    <button class="deco-btn look-btn" data-look="eyes:none" data-onclick="setSculptLook('eyes','none')">无</button>
                </div>
                <div class="sheet-row look-group" data-group="mouth">
                    <button class="deco-btn look-btn" data-look="mouth:smile" data-onclick="setSculptLook('mouth','smile')">‿ 微笑</button>
                    <button class="deco-btn look-btn" data-look="mouth:cat" data-onclick="setSculptLook('mouth','cat')">ω 猫嘴</button>
                    <button class="deco-btn look-btn" data-look="mouth:o" data-onclick="setSculptLook('mouth','o')">○ 惊讶</button>
                    <button class="deco-btn look-btn" data-look="mouth:tongue" data-onclick="setSculptLook('mouth','tongue')">👅 吐舌</button>
                    <button class="deco-btn look-btn" data-look="mouth:none" data-onclick="setSculptLook('mouth','none')">无</button>
                </div>
                <div class="sheet-row look-group" data-group="hair">
                    <button class="deco-btn look-btn" data-look="hair:none" data-onclick="setSculptLook('hair','none')">无</button>
                    <button class="deco-btn look-btn" data-look="hair:bob" data-onclick="setSculptLook('hair','bob')">蘑菇头</button>
                    <button class="deco-btn look-btn" data-look="hair:twintail" data-onclick="setSculptLook('hair','twintail')">双马尾</button>
                    <button class="deco-btn look-btn" data-look="hair:bun" data-onclick="setSculptLook('hair','bun')">丸子头</button>
                    <button class="deco-btn look-btn" data-look="hair:long" data-onclick="setSculptLook('hair','long')">长发</button>
                    <button class="deco-btn look-btn" data-look="hair:hat" data-onclick="setSculptLook('hair','hat')">小礼帽</button>
                    <button class="deco-btn look-btn" data-look="hair:chef" data-onclick="setSculptLook('hair','chef')">厨师帽</button>
                </div>
                <div class="sheet-row look-group" data-group="arms">
                    <button class="deco-btn look-btn" data-look="arms:down" data-onclick="setSculptLook('arms','down')">放下</button>
                    <button class="deco-btn look-btn" data-look="arms:up" data-onclick="setSculptLook('arms','up')">举起</button>
                    <button class="deco-btn look-btn" data-look="arms:wave" data-onclick="setSculptLook('arms','wave')">挥手</button>
                    <button class="deco-btn look-btn" data-look="arms:cheek" data-onclick="setSculptLook('arms','cheek')">托腮</button>
                </div>
                <div class="sheet-row look-group" data-group="acc">
                    <button class="deco-btn look-btn" data-look="acc:none" data-onclick="setSculptLook('acc','none')">无</button>
                    <button class="deco-btn look-btn" data-look="acc:glasses" data-onclick="setSculptLook('acc','glasses')">👓 眼镜</button>
                    <button class="deco-btn look-btn" data-look="acc:bow" data-onclick="setSculptLook('acc','bow')">🎀 蝴蝶结</button>
                    <button class="deco-btn look-btn" data-look="acc:scarf" data-onclick="setSculptLook('acc','scarf')">🧣 围巾</button>
                    <button class="deco-btn look-btn" data-look="acc:heart" data-onclick="setSculptLook('acc','heart')">💗 爱心手持</button>
                </div>
                <div class="sheet-row look-group" data-group="clay">
                    <button class="deco-btn look-btn sculpt-tool on" data-onclick="setSculptTool('push', this)">👉 推</button>
                    <button class="deco-btn look-btn sculpt-tool" data-onclick="setSculptTool('squeeze', this)">🤲 挤</button>
                    <button class="deco-btn look-btn sculpt-tool" data-onclick="setSculptTool('poke', this)">☝️ 戳</button>
                    <button class="deco-btn look-btn sculpt-tool" data-onclick="setSculptTool('smooth', this)">🫳 抹</button>
                    <button class="deco-btn look-btn sculpt-tool" data-onclick="setSculptTool('peak', this)">🤏 捏尖</button>
                    <span class="sub-label">幅度</span>
                    <input type="range" id="sculptBrushRange" min="1" max="10" step="1" value="3" data-oninput="setBrushLevel(this.value)" aria-label="幅度">
                </div>
                <div class="sheet-row look-group" data-group="paint">
                    <button class="pen-dot active" data-style="background:#e8334a;" data-onclick="setPenColor('#e8334a', this)" title="草莓红" aria-label="草莓红"></button>
                    <button class="pen-dot" data-style="background:#ffc400;" data-onclick="setPenColor('#ffc400', this)" title="柠檬黄" aria-label="柠檬黄"></button>
                    <button class="pen-dot" data-style="background:#3fa34d;" data-onclick="setPenColor('#3fa34d', this)" title="抹茶绿" aria-label="抹茶绿"></button>
                    <button class="pen-dot" data-style="background:#2f8fe0;" data-onclick="setPenColor('#2f8fe0', this)" title="蓝莓蓝" aria-label="蓝莓蓝"></button>
                    <button class="pen-dot" data-style="background:#9b59d0;" data-onclick="setPenColor('#9b59d0', this)" title="紫薯紫" aria-label="紫薯紫"></button>
                    <button class="pen-dot" data-style="background:#ff7eb6;" data-onclick="setPenColor('#ff7eb6', this)" title="樱花粉" aria-label="樱花粉"></button>
                    <button class="pen-dot" data-style="background:#ffffff;" data-onclick="setPenColor('#ffffff', this)" title="奶白" aria-label="奶白"></button>
                    <button class="pen-dot" data-style="background:#3b1d0e;" data-onclick="setPenColor('#3b1d0e', this)" title="巧克力" aria-label="巧克力"></button>
                </div>
                <div class="sheet-row sheet-sliders">
                    <span class="sub-label">大小</span>
                    <input type="range" id="sculptScale" min="0.5" max="2" step="0.1" value="1" data-oninput="setSculptScale(this.value)" aria-label="大小">
                    <span class="sub-label slider-val" id="sculptScaleVal" data-i18n-skip>1.0×</span>
                    <span class="sub-label">旋转</span>
                    <input type="range" id="sculptYaw" min="-180" max="180" step="5" value="0" data-oninput="setSculptYaw(this.value)" aria-label="旋转">
                    <span class="sub-label slider-val" id="sculptYawVal" data-i18n-skip>0°</span>
                </div>
                <div class="sheet-row sheet-actions">
                    <button class="act-btn btn-spell" data-onclick="placeSculptOnCream()">✅ 贴到咖啡上</button>
                    <button class="act-btn btn-undo" data-onclick="undo()">↩️ 撤回</button>
                    <button class="act-btn btn-reset" data-onclick="removeActiveSculpt()">🗑 去掉所选</button>
                    <button class="act-btn btn-reset" data-onclick="clearSculptBench()">🧹 清空雕琢台</button>
                </div>
            </div>

            <!-- 功能模式切换 -->
            <div class="tool-switch">
                <button class="tool-btn active" id="btnToolAdd" data-onclick="setMainMode('ADD')"><span class="tb-ico">🍨</span><span>放冰淇淋</span></button>
                <button class="tool-btn" id="btnToolPinch" data-onclick="setMainMode('PINCH')"><span class="tb-ico">🤏</span><span>捏起来</span></button>
                <button class="tool-btn" id="btnToolClay" data-onclick="setMainMode('CLAY')"><span class="tb-ico">🧸</span><span>橡皮泥</span></button>
                <button class="tool-btn" id="btnToolFlatten" data-onclick="setMainMode('FLATTEN')"><span class="tb-ico">🥄</span><span>勺背压平</span></button>
                <button class="tool-btn" id="btnToolSpoon" data-onclick="setMainMode('SPOON')"><span class="tb-ico">🌪️</span><span>旋涡乳化</span></button>
                <button class="tool-btn" id="btnToolPitcher" data-onclick="setMainMode('PITCHER')"><span class="tb-ico">🥛</span><span>金边拉花</span></button>
                <button class="tool-btn" id="btnToolEtch" data-onclick="setMainMode('ETCH')"><span class="tb-ico">🍫</span><span>描边彩笔</span></button>
                <button class="tool-btn" id="btnToolDeco" data-onclick="setMainMode('DECO')"><span class="tb-ico">🍋</span><span>小装饰</span></button>
                <button class="tool-btn" id="btnToolCup" data-onclick="setMainMode('CUP')"><span class="tb-ico">🎨</span><span>画画</span></button>
                <button class="tool-btn" id="btnToolSculpt" data-onclick="setMainMode('SCULPT')"><span class="tb-ico">🗿</span><span>雕琢台</span></button>
                <button class="tool-btn" id="btnToolOrbit" data-onclick="setMainMode('ORBIT')"><span class="tb-ico">🖐️</span><span>转视角</span></button>
            </div>

            <div class="action-row">
                <button class="act-btn btn-undo" data-onclick="undo()">↩️ 撤回</button>
                <button class="act-btn btn-reset" data-onclick="resetCup()">🧹 清空重来</button>
                <button class="act-btn btn-spell" data-onclick="castSpell()">✨ 美味魔法</button>
            </div>
        </div>
    </div>

    <script src="./i18n.js"></script>
    <script src="./app.js"></script>
</body>
</html>
