<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>努努赛博定制台 · 图样与裸娃实时联动</title>
<meta name="description" content="用公开的努努图纸：在图样上画脸，在 3D 裸娃上画发片，两边实时互相投射；自动防止画错地方和备料错误。">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="回到游戏盒子"><span>✿</span><div>努努赛博定制台<small>NUNU CYBER ATELIER</small></div></a>
  <div class="project">
    <input id="projectName" aria-label="作品名称" maxlength="40">
    <span id="saveStatus">保存在此浏览器</span>
  </div>
  <div class="actions">
    <button id="btnSave" type="button">保存</button>
    <div class="menu-wrap">
      <button id="btnExport" type="button" class="primary" aria-haspopup="true" aria-expanded="false">导出 ▾</button>
      <div id="exportMenu" class="menu" hidden>
        <button type="button" id="exportSvg">纸样 SVG（1:1，毫米）</button>
        <button type="button" id="exportPng">彩色图样 PNG</button>
        <button type="button" id="exportBom">备料单 TXT</button>
        <label class="ack" id="ackWrap" hidden><input type="checkbox" id="ack"> 我已看过检查里的警告</label>
        <p class="menu-note" id="exportNote"></p>
      </div>
    </div>
  </div>
</header>

<section class="toolbar" aria-label="画笔和守卫">
  <div class="group" role="group" aria-label="画在哪一层">
    <button type="button" data-layer="face" class="seg on" title="眼睛、嘴：只能画在脸片的脸窗里">脸</button>
    <button type="button" data-layer="skin" class="seg" title="腮红、花纹：画在肤色布的裁片上">彩绘</button>
    <button type="button" data-layer="hair" class="seg" title="后发：给头顶发、后脑涂色（缝上去）；前发：画在脸片的额头上（贴上去）">发片</button>
  </div>
  <div class="group" role="group" aria-label="工具">
    <button type="button" id="toolPen" class="seg on">✎ 画笔</button>
    <button type="button" id="toolEraser" class="seg">橡皮擦</button>
  </div>
  <div class="group swatch-group"><div id="swatches" class="swatches"></div><input type="color" id="customColor" aria-label="自定义颜色" value="#4b3939"></div>
  <label class="size">笔 <input type="range" id="brushSize" min="0.5" max="30" step="0.5" value="3"><output id="brushOut">3 mm</output></label>
  <div class="group toggles">
    <label><input type="checkbox" id="mirror" checked> 左右对称</label>
    <label title="离缝线太近的地方不让画"><input type="checkbox" id="seamGuard" checked> 接缝保护</label>
    <label><input type="checkbox" id="showZones"> 显示不能画的地方</label>
    <label><input type="checkbox" id="showGuides" checked> 眼嘴参考框</label>
    <label><input type="checkbox" id="showSeams" checked> 缝线 / 记号</label>
  </div>
  <div class="group">
    <button type="button" id="undo" title="撤销">↶</button>
    <button type="button" id="redo" title="重做">↷</button>
  </div>
  <p id="layerHint" class="layer-hint" role="status"></p>
</section>

<main class="workspace">
  <section class="panel" id="sheetPanel">
    <div class="panel-head">
      <div><span class="number">01</span><b>图样</b><small>公开努努图纸，在裁片上画，3D 立刻跟着变</small></div>
      <div class="mini"><button type="button" id="zoomOut" aria-label="缩小">−</button><button type="button" id="zoomFit">适应</button><button type="button" id="zoomIn" aria-label="放大">＋</button></div>
    </div>
    <div class="stage"><canvas id="sheet" aria-label="图样：每一片裁片，可以直接在上面画"></canvas></div>
    <p class="caption">实线是缝线，虚线是裁剪线（含缝份），蓝色虚线是脸窗和眼嘴参考框。点一片选中，它在 3D 上会亮起来；右键拖动平移，滚轮缩放。</p>
  </section>
  <section class="panel" id="modelPanel">
    <div class="panel-head">
      <div><span class="number">02</span><b>3D 裸娃</b><small>在娃娃身上画，图样立刻跟着变</small></div>
      <div class="mini">
        <button type="button" id="modePaint" class="on">画</button><button type="button" id="modeRotate">转</button>
        <button type="button" data-view="0">正</button><button type="button" data-view="1.5708">侧</button><button type="button" data-view="3.1416">背</button>
      </div>
    </div>
    <div class="stage"><canvas id="model" aria-label="3D 娃娃，可以直接在上面画"></canvas><div id="modelError" hidden>这个浏览器没有开 3D，打开 WebGL 就能看到娃娃。图样这边照常能用。</div></div>
    <p class="caption">「画」模式下左键画，右键拖动转；「转」模式下左键拖动转、点一下选中那一片；滚轮缩放。没有裁片盖着的地方（裸露的娃娃）画不上去。</p>
  </section>
</main>

<section class="dock" aria-label="图纸、备料、检查、设置">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="pattern" class="on">图纸</button>
    <button type="button" role="tab" data-tab="bom">备料 <i id="bomBadge"></i></button>
    <button type="button" role="tab" data-tab="check">检查 <i id="checkBadge"></i></button>
    <button type="button" role="tab" data-tab="setup">设置</button>
  </div>
  <div id="dockBody" class="dock-body"></div>
</section>

<input type="file" id="importFile" accept="image/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="../ice-cream-latte/three.min.js"></script>
<script src="nunu-shape.js?v=6"></script>
<script src="pattern-data.js?v=6"></script>
<script src="nunu-core.js?v=6"></script>
<script src="model3d.js?v=6"></script>
<script src="sheet.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
