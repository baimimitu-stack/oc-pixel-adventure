<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剧情策划台</title>
<style>
:root{--z:1;--vh:100vh;--bg:#f4f1ec;--panel:#fff;--ink:#2b2622;--mute:#8a8178;--line:#e4ded5;--acc:#b5543a;--accbg:#f6e7e1;--shadow:0 1px 2px rgba(60,40,20,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#171513;--panel:#222;--ink:#ebe5de;--mute:#9a9188;--line:#37322d;--acc:#e08a6e;--accbg:#3a2a24;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:var(--vh);zoom:var(--z)}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{white-space:nowrap;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--mute)}
button.ghost:hover{color:var(--acc)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
#ptitle{font-size:18px;font-weight:700;border:0;background:transparent;width:200px}
.sp{flex:1}
#jwrap{position:relative;width:260px}
#jump{width:100%;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}
#jres{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:320px;overflow:auto;z-index:20;display:none}
#jres div{padding:8px 14px;cursor:pointer;font-size:14px}
#jres div:hover,#jres div.on{background:var(--accbg)}
#jres small{color:var(--mute);margin-left:8px}
#main{flex:1;overflow:auto;padding:22px 20px 60px}
.wrap{max-width:1040px;margin:0 auto}
/* 底部页签 */
#sheets{display:flex;align-items:flex-end;gap:2px;padding:0 14px;background:var(--bg);border-top:1px solid var(--line);overflow-x:auto;min-height:42px}
#sheets button{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:var(--panel);color:var(--mute);padding:8px 18px;white-space:nowrap}
#sheets button.on{color:var(--acc);font-weight:700;background:var(--accbg);border-color:var(--acc)}
#sheets .add{border-style:dashed}
/* 卡片页 */
.strip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.chip{padding:6px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--line);cursor:pointer;box-shadow:var(--shadow)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip.add{border-style:dashed;color:var(--acc);background:transparent;box-shadow:none}
.sheet{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.left,.right{background:var(--panel);border-radius:14px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.imgbox{border:2px dashed var(--line);border-radius:12px;min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;cursor:pointer;text-align:center;padding:10px;position:relative;overflow:hidden}
.imgbox.has{border:0;padding:0}
.imgbox img{width:100%;display:block;border-radius:12px;max-height:440px;object-fit:cover}
.imgbox .x{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:26px;height:26px;padding:0}
.flabel{margin:18px 0 6px;color:var(--mute);font-size:13px}
.fld{margin-bottom:10px;position:relative}
.fld .fk{border:0;background:transparent;color:var(--acc);font-size:13px;font-weight:700;width:calc(100% - 24px);padding:0}
.fld .fv{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;resize:none;overflow:hidden;padding:2px 0;line-height:1.6}
.fld .fd{position:absolute;right:0;top:0;border:0;background:transparent;color:var(--mute);padding:0 4px}
input.ttl{font-size:26px;font-weight:700;width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;padding:2px 0;margin-bottom:12px}
textarea.auto{width:100%;border:0;background:transparent;resize:none;overflow:hidden;min-height:260px;line-height:1.9;font-size:16px}
textarea.auto:focus,input:focus{outline:none}
.refs{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--mute)}
.ref{display:inline-block;margin:2px 4px 2px 0;padding:0 10px;border-radius:10px;background:var(--accbg);color:var(--acc);cursor:pointer}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.tools select{font-size:13px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.empty{text-align:center;padding:80px 0;color:var(--mute)}
/* 树状时间轴 */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar .sp{flex:1}
.canvas{position:relative;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);height:min(calc(var(--vh)*.52),500px);min-height:240px}
.cin{position:relative}
.cin svg{position:absolute;left:0;top:0;pointer-events:none}
.cin path{fill:none;stroke:var(--line);stroke-width:2}
.cin path.hot{stroke:var(--acc)}
.tn{position:absolute;width:176px;height:64px;border-radius:12px;background:var(--bg);border:2px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;overflow:hidden;line-height:1.3}
.tn:hover{border-color:var(--acc)}
.tn.sel{border-color:var(--acc);background:var(--accbg)}
.tn img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.tn .tx{min-width:0;flex:1}
.tn b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.tn i{display:block;font-style:normal;font-size:11px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn .cb{position:absolute;right:6px;bottom:2px;font-size:11px;color:var(--mute)}
.anch{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--accbg)}
.anch b{font-size:13px;color:var(--acc)}
.anch .ar{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.anch .ref{margin:0}
.anch .ux{border:0;background:transparent;color:var(--mute);padding:0 4px;margin-left:-2px}
.anch select{font-size:13px;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);max-width:46%}
.tn .ab{position:absolute;right:6px;top:3px;font-size:11px;color:var(--acc);font-weight:700}
.wrap.wide{max-width:1280px}
.plan{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.outline{position:sticky;top:0;max-height:calc(var(--vh) - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px;box-shadow:var(--shadow)}
.orow{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.5}
.orow:hover{background:var(--bg)}
.orow.on{background:var(--accbg);color:var(--acc);font-weight:700}
.orow.h{font-weight:700;margin-top:6px}
.orow small{margin-left:auto;color:var(--mute);font-weight:400}
.car{width:16px;text-align:center;color:var(--mute);flex:none}
.pmain{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 30px;box-shadow:var(--shadow);min-width:0}
.pmain h1{margin:0 0 10px;font-size:26px}
.pmain .sec{margin:22px 0 8px;font-size:13px;color:var(--mute)}
.crumb{color:var(--mute);font-size:13px;margin-bottom:6px}
.crumb a{cursor:pointer;color:var(--acc)}
.pmain .ent{display:flex;gap:18px;align-items:flex-start}
.pmain .ent img{width:180px;border-radius:10px;flex:none}
.pmain .w{color:var(--acc);font-size:13px;font-weight:700}
.pmain .kv{color:var(--mute);font-size:14px}
.pmain .kv b{color:var(--ink)}
.pmain p{white-space:pre-wrap;margin:8px 0}
.gridc{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gc{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg)}
.gc:hover{border-color:var(--acc)}
.gc img{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:6px}
.btb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.btb button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btb select{font-size:13px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);max-width:190px}
.sepv{width:1px;height:22px;background:var(--line);margin:0 4px}
.cdot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.cdot.on{border-color:var(--ink)}
.stage{position:relative;height:calc(var(--vh) - 230px);min-height:360px;overflow:hidden;background-color:var(--panel);border:1px solid var(--line);border-radius:14px;touch-action:none;user-select:none;background-image:radial-gradient(var(--line) 1.3px,transparent 1.3px);background-size:24px 24px}
.stage.t-pen{cursor:crosshair}.stage.t-hand{cursor:grab}.stage.t-eraser{cursor:cell}.stage.t-link{cursor:alias}.stage.t-card{cursor:copy}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#bnodes{position:absolute;left:0;top:0}
#bedge .hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#bedge .vis{stroke:#8a8178;stroke-width:2.5}
#bedge .esel .vis{stroke:var(--acc);stroke-width:4}
#bpen path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#bpen path.psel{filter:drop-shadow(0 0 4px var(--acc))}
.bn{position:absolute;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.14);border:2px solid transparent;color:#2b2622;font-size:15px;line-height:1.5;cursor:move}
.bn.sel{border-color:var(--acc)}
.bn .bt{white-space:pre-wrap;min-height:22px;outline:none;word-break:break-word;cursor:inherit}
.bn .bt[contenteditable=true]{cursor:text;background:rgba(255,255,255,.6);border-radius:4px}
.bn .br{margin-top:6px;font-size:12px;color:#b5543a;cursor:pointer;text-decoration:underline dotted}
.bn .bh{position:absolute;right:-10px;top:50%;margin-top:-8px;width:16px;height:16px;border-radius:50%;background:var(--acc);display:block;opacity:.4;cursor:alias;border:2px solid #fff}
.bn.sel .bh,.bn:hover .bh{opacity:1}
.bn .br.auto span{color:#6b7f59}
#bframes{position:absolute;left:0;top:0}
.bf{position:absolute;border:2px dashed;border-radius:14px;pointer-events:none}
.bf.sel{box-shadow:0 0 0 3px rgba(181,84,58,.35)}
.bf .ft{position:absolute;left:-2px;top:-2px;max-width:calc(100% + 4px);min-width:70px;height:26px;padding:0 12px;border-radius:12px 12px 12px 0;color:#fff;font-size:13px;line-height:26px;pointer-events:auto;cursor:move;white-space:nowrap;overflow:hidden}
.bf .ftt{outline:none}
.bf .ftt:empty:before{content:'方框（双击起名）';opacity:.75}
.bf .ftt[contenteditable=true]{background:rgba(255,255,255,.28);padding:0 4px;border-radius:4px;cursor:text}
.bf .fr{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:4px;background:var(--acc);cursor:nwse-resize;pointer-events:auto;display:none;border:2px solid #fff}
.bf.sel .fr{display:block}
#bmarq.bmf{border-style:solid;border-color:#b5543a;background:rgba(181,84,58,.12)}
#bfloat{position:absolute;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5}
#bfloat[hidden]{display:none}
.cm{position:fixed;z-index:100;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;color:var(--ink)}
.cm .mi,.pkl .mi{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px}
.cm .mi:hover,.pkl .mi:hover{background:var(--accbg)}
.cm .danger{color:#c0392b}
.cm .sep{height:1px;background:var(--line);margin:4px 0}
.cm .cmc{display:flex;gap:8px;padding:6px 12px}
.pkl{max-height:300px;overflow:auto;margin-bottom:10px}
.bn.from{outline:3px dashed var(--acc);outline-offset:3px}
.bn .bx{display:none;margin-left:6px;cursor:pointer;color:#777}
.bn.sel .bx{display:inline}
.bwrap{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
.bmain{min-width:0}
.bwrap .stage{height:calc(var(--vh) - 270px)}
.bai{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;height:calc(var(--vh) - 150px);min-height:420px}
.bchat{flex:1;overflow:auto;font-size:13.5px;line-height:1.6}
.bchat .m{margin:6px 0;padding:6px 10px;border-radius:10px;white-space:pre-wrap}
.bchat .u{background:var(--accbg);margin-left:22px}
.bchat .a{background:var(--bg);margin-right:22px}
.bai .qk{display:flex;flex-wrap:wrap;gap:6px}
.bai .qk button{font-size:12px;padding:3px 9px}
.bai textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);font-size:14px;resize:vertical}
#bmarq{position:absolute;border:1.5px dashed var(--acc);background:rgba(181,84,58,.08);pointer-events:none}
.mapbox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);touch-action:none;user-select:none;background-image:radial-gradient(var(--line) 1.3px,transparent 1.3px);background-size:24px 24px}
.mapbox.has{background-image:none}
.mapbox img{width:100%;display:block;-webkit-user-drag:none}
.mapbox.adding{cursor:crosshair;outline:3px dashed var(--acc);outline-offset:-3px}
.mapph{padding:110px 24px;text-align:center;color:var(--mute);line-height:2}
.pin{position:absolute;transform:translate(-11px,-50%);display:flex;align-items:center;gap:6px;cursor:pointer;z-index:2}
.pin .dot{width:22px;height:22px;flex:none;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);background:var(--pc)}
.pin:hover .dot{transform:scale(1.2)}
.pin .pl{background:rgba(255,255,255,.93);color:#2b2622;border-radius:10px;padding:0 9px;font-size:13px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);outline:none}
.pin .pl[contenteditable=true]{outline:2px solid var(--acc);cursor:text}
.sheet select{font-size:14px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.zoom{display:inline-flex;gap:2px}.zoom button{padding:3px 9px}
.textpage .tools{align-items:center}
.textpage textarea.auto{min-height:calc(var(--vh)*.6);font-size:16px;line-height:1.95;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.rv{display:flex;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.rv input{width:auto;margin:6px 0 0}
.rv.skip{opacity:.5}
.tg{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:8px;padding:0 8px;font-size:12px}
#rvList,#lgList{max-height:50vh;overflow:auto;margin:8px 0}
.lg{padding:10px 4px;border-bottom:1px solid var(--line)}
.lg.undone{opacity:.55}
.lg button{margin-top:6px;font-size:12px}
dialog label{display:block;font-size:13px;color:var(--mute)}
.stools{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:13px}
.stools button{font-size:13px;padding:3px 10px}
.sct{display:flex;gap:6px;margin-bottom:12px}
.sct button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#scBody{max-height:62vh;overflow:auto}
table.fmt{border-collapse:collapse;width:100%;font-size:14px}
table.fmt td,table.fmt th{border-bottom:1px solid var(--line);padding:6px 10px 6px 0;vertical-align:top;text-align:left}
table.fmt code{background:var(--bg);padding:1px 6px;border-radius:5px;white-space:pre-wrap}
.iss{padding:4px 0;font-size:14px}.iss.err{color:#c0392b}.iss.warn{color:#b9770e}.iss.ok{color:#3a7d44}
.pvv{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pvn{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px 10px;font-size:14px}
.pvn em{font-style:normal;font-size:12px}.pvn em.up{color:#3a7d44}.pvn em.dn{color:#c0392b}
.pvs{background:var(--bg);border-radius:12px;padding:14px 18px}
.pvs h4{margin:0 0 6px;color:var(--acc)}
.pvs p{margin:6px 0}.pvs .nar{color:var(--mute);font-style:italic}
.pch{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pch button{text-align:left;padding:8px 14px;font-size:15px}
.pch button:disabled{opacity:.5;cursor:not-allowed}.pch small{color:var(--mute);margin-left:8px}
.pend{text-align:center;margin-top:14px;color:var(--acc);font-weight:700}
.pvt{margin-top:10px;display:flex;gap:8px}
.tdots{display:flex;gap:6px;margin-top:12px}.td{width:8px;height:8px;border-radius:50%;background:var(--line)}.td.on{background:var(--acc)}
#tourBody h3{margin:0 0 8px}#tourBody p{margin:6px 0;line-height:1.8}
.elb{fill:var(--ink);stroke:var(--panel);stroke-width:4px;paint-order:stroke;font-size:11px;pointer-events:none}
#savebar{background:#fdecea;color:#b03a2e;padding:8px 20px;font-size:14px;border-bottom:1px solid #f5c6c0;line-height:1.6}
.tlbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.tsplit{display:grid;align-items:start}
.tsplit.one{grid-template-columns:1fr}
.pane{min-width:0}
.gutter{cursor:col-resize;background:var(--line);width:4px;border-radius:2px;align-self:stretch;min-height:240px;justify-self:center}
.gutter:hover{background:var(--acc)}
.psel{font-size:14px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);max-width:62%}
.pane textarea.auto{min-height:calc(var(--vh)*.5);font-size:15.5px;line-height:1.9;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
@media(max-width:820px){.tsplit{grid-template-columns:1fr!important}.gutter{display:none}}
.hint{color:var(--mute);font-size:13px;margin:8px 2px 14px}
/* 策划案 */
.doc{background:var(--panel);border-radius:14px;padding:40px 56px;box-shadow:var(--shadow);border:1px solid var(--line)}
.doc h1{margin-top:0}
.doc h2{border-bottom:2px solid var(--acc);padding-bottom:4px;margin-top:40px}
.doc h3{margin:26px 0 4px}
.doc .toc a{display:block;color:var(--ink);text-decoration:none;cursor:pointer;padding:1px 0}
.doc .toc a:hover{color:var(--acc)}
.doc .toc .h{font-weight:700;margin-top:8px}
.doc .ent{display:flex;gap:18px;align-items:flex-start}
.doc .ent img{width:150px;border-radius:10px;flex:none}
.doc .w{color:var(--acc);font-size:13px;font-weight:700}
.doc .kv{color:var(--mute);font-size:14px}
.doc p{white-space:pre-wrap;margin:6px 0}
a.go{color:var(--acc);cursor:pointer;text-decoration:underline dotted}
/* AI 抽屉 */
#ai{position:fixed;right:0;top:0;bottom:42px;width:min(360px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding:16px;overflow:auto;transform:translateX(105%);transition:transform .2s;z-index:30}
#ai.open{transform:none}
#ai input,#ai textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);margin-bottom:8px;font-size:14px}
#ai textarea{min-height:70px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
#aiout{white-space:pre-wrap;font-size:14px}
.mute{color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#c0392b;color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:50}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(400px,92vw)}
dialog input,dialog select{width:100%;margin:4px 0 12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
@media(max-width:820px){.bwrap{grid-template-columns:1fr}.bai{height:auto;min-height:0}.bchat{max-height:200px}.plan{grid-template-columns:1fr}.outline{position:static;max-height:240px}.pmain .ent{flex-direction:column}.sheet{grid-template-columns:1fr}.more{grid-template-columns:1fr}.doc{padding:22px}#jwrap{width:130px}}
</style>
</head>
<body>
<div id="app">
<header>
  <input id="ptitle" aria-label="项目名">
  <button id="bBack" hidden>← 返回</button>
  <div id="jwrap"><input id="jump" placeholder="跳转到…（Ctrl+K）" autocomplete="off"><div id="jres"></div></div>
  <span class="sp"></span>
  <button id="bFile">文件 ▾</button>
  <button id="bAi" class="pri">AI 助手</button>
  <button id="bHelp" title="新手教程">？</button>
  <button id="bSet" title="设置、教程、页面缩放">⚙</button>
  <input type="file" id="file" accept=".json" hidden>
  <input type="file" id="imgfile" accept="image/*" hidden>
</header>
<div id="main"></div>
<div id="sheets"></div>
<aside id="ai">
  <div style="display:flex;justify-content:space-between;align-items:center"><b>AI 助手（DeepSeek）</b><span><button class="ghost" id="aSet">设置</button><button class="ghost" id="aClose">✕</button></span></div>
  <p class="mute">AI 只给建议，你点「采纳」才会写进策划。</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button id="aGap">补充事件</button><button id="aRand">随机事件</button><button id="aCheck">查矛盾</button></div>
  <input id="aHint" placeholder="可选：限定人物 / 地点 / 方向">
  <textarea id="aQ" placeholder="直接和 AI 讨论…（它能看到全部设定）"></textarea>
  <button class="pri" id="aAsk">发送</button>
  <div id="aiout" style="margin-top:10px" class="mute">结果显示在这里。</div>
</aside>
</div>
<div id="toast"></div>

<dialog id="dlgAi" style="width:min(520px,94vw)">
  <form method="dialog">
    <b>API 设置台</b>
    <p class="mute">密钥只存在这台电脑的浏览器里，导出文件和发给对方的文件不会带上它。</p>
    <label>服务商<select id="sPre"><option value="deepseek">DeepSeek</option><option value="custom">自定义（OpenAI 兼容接口）</option></select></label>
    <label>接口地址<input id="sBase" placeholder="https://api.deepseek.com" autocomplete="off"></label>
    <label>模型<input id="sModel" list="mdl" placeholder="deepseek-chat" autocomplete="off"><datalist id="mdl"><option value="deepseek-chat"><option value="deepseek-reasoner"></datalist></label>
    <label>API 密钥<span style="display:flex;gap:6px"><input id="sKey" type="password" autocomplete="off" style="flex:1"><button type="button" id="sShow">显示</button></span></label>
    <label>温度：<b id="sTv"></b>（越低越稳，越高越发散）<input id="sTemp" type="range" min="0" max="1.5" step="0.1"></label>
    <label>单次最长输出（token，留空 = 接口默认）<input id="sMax" type="number" min="0" placeholder="例如 4000"></label>
    <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:10px"><input type="checkbox" id="sJson" style="width:auto;margin:4px 0 0"><span>要求接口返回 JSON（提取文稿、白板画图要用；个别接口不支持时关掉）</span></label>
    <div id="sTest" class="mute" style="min-height:22px"></div>
    <div id="sUse" class="mute" style="margin-bottom:8px"></div>
    <button type="button" id="sTestBtn">测试连接</button> <button type="button" id="sClear" style="color:#c0392b">清除密钥</button>
    <div style="margin-top:14px"><button class="pri" value="ok">保存</button> <button value="cancel">取消</button></div>
  </form>
</dialog>
<dialog id="dlgReview" style="width:min(720px,96vw)">
  <form method="dialog">
    <b>AI 改动报备：确认后才会写入</b>
    <div id="rvSum" class="mute" style="margin:6px 0"></div>
    <div id="rvList"></div>
    <div id="rvNote" class="mute"></div>
    <div style="margin-top:12px"><button type="button" class="pri" id="rvApply">应用勾选的改动</button> <button type="button" id="rvAll">全选 / 全不选</button> <button value="cancel">都不应用</button></div>
  </form>
</dialog>
<dialog id="dlgLog" style="width:min(640px,96vw)">
  <form method="dialog"><b>修改记录</b><p class="mute">AI 帮你改的、采纳 AI 建议的、导入合并来的，都记在这里，能整批撤销。</p><div id="lgList"></div><button value="cancel">关闭</button></form>
</dialog>
<dialog id="dlgScript" style="width:min(760px,96vw)">
  <form method="dialog">
    <div class="sct"><button type="button" data-sct="fmt">格式与示例</button><button type="button" data-sct="chk">检查与数值</button><button type="button" data-sct="play">▶ 试玩</button></div>
    <div id="scBody"></div>
    <div style="margin-top:12px"><button value="cancel">关闭</button></div>
  </form>
</dialog>
<dialog id="dlgTour" style="width:min(520px,94vw)">
  <form method="dialog">
    <div id="tourBody"></div><div id="tourDots" class="tdots"></div>
    <div style="margin-top:12px;display:flex;gap:8px"><button type="button" id="tPrev">上一步</button><button type="button" class="pri" id="tNext">下一步</button><span class="sp"></span><button value="cancel" class="ghost">关闭</button></div>
  </form>
</dialog>
<dialog id="dlgText" style="width:min(420px,94vw)">
  <form method="dialog"><b id="dtTitle"></b><input id="dtIn" autocomplete="off"><button class="pri" value="ok">确定</button> <button value="cancel">取消</button></form>
</dialog>
<dialog id="dlgPick">
  <form method="dialog"><b>选择要关联的条目</b><input id="pkq" placeholder="搜索条目名…" autocomplete="off"><div id="pkl" class="pkl"></div><button value="cancel">关闭</button></form>
</dialog>
<dialog id="dlgSheet">
  <form method="dialog">
    <b id="dsTitle">新页面</b>
    <label>页面名字<input id="dsName" placeholder="如：人设 / CG 列表 / 支线"></label>
    <label>页面样式<select id="dsKind"><option value="card">卡片页：上面选条目，左图右文，属性自定义</option><option value="board">白板：自由画布，能画画、框选、连线</option><option value="map">地图页：底图上放点，点进去逐层细化，可导出给美术</option><option value="text">文稿页：纯文本写作，可让 AI 提取后补全其他页面</option><option value="tree">时间轴页：纵向树状图，事件缩略 + 分支</option></select></label>
    <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px"><input type="checkbox" id="dsAuto" style="width:auto;margin:4px 0 0"><span>自动关联：别处文字里只要写出这个页面里的条目名 / 别名 / 代号，就自动变成可点的链接，不用手动绑定</span></label>
    <button class="pri" value="ok">保存</button> <button value="cancel">取消</button> <button value="del" class="danger" id="dsDel" style="float:right;color:#c0392b">删除此页</button>
  </form>
</dialog>

<script>
const KEY='storyplanner.v2',OLD='storyplanner.v1',AIKEY='storyplanner.ai';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
const DEFAULT_SHEETS=()=>[
  {id:'s_text',name:'文稿',kind:'text',order:0,updatedAt:1},
  {id:'s_char',name:'人设',kind:'card',order:1,updatedAt:1},
  {id:'s_place',name:'地图',kind:'map',order:2,updatedAt:1},
  {id:'s_event',name:'时间轴',kind:'tree',order:3,updatedAt:1},
  {id:'s_log',name:'CG',kind:'card',order:4,updatedAt:1},
  {id:'s_board',name:'白板',kind:'board',order:5,updatedAt:1}];
function normalize(d){
  d.title=d.title||'未命名策划';d.board=d.board||[];d.log=d.log||[];d.flags=d.flags||{};
  if(!Array.isArray(d.sheets)||!d.sheets.length)d.sheets=DEFAULT_SHEETS();
  d.sheets.forEach(s=>{if(s.kind==='line')s.kind='tree';if(s.id==='s_place'&&s.kind==='card')s.kind='map';if(s.id==='s_log'&&s.name==='日志')s.name='CG'});
  if(!d.flags.text){if(!d.sheets.some(s=>s.kind==='text'))d.sheets.push({id:'s_text',name:'文稿',kind:'text',order:0,updatedAt:1});d.flags.text=true}
  d.items=(d.items||[]).map(i=>{
    if(!i.sheet)i.sheet='s_'+(i.type||'event');
    i.fields=i.fields||[];i.links=i.links||[];i.when=i.when||'';i.body=i.body||'';i.title=i.title||'';i.order=i.order||0;i.updatedAt=i.updatedAt||0;
    return i;
  });
  d.sheets.filter(s=>s.kind==='map').forEach(s=>d.items.forEach(i=>{if(i.sheet===s.id&&i.parent===undefined)i.parent=''}));
  // 树状页：没有 parent 的旧节点，按原顺序接成一条链
  d.sheets.filter(s=>s.kind==='tree').forEach(s=>{
    let prev='';
    d.items.filter(i=>i.sheet===s.id&&!i.del).sort((a,b)=>a.order-b.order).forEach(i=>{
      if(i.parent===undefined)i.parent=prev;
      prev=i.id;
    });
  });
  return d;
}
let db=normalize({}),ai={key:'',model:'deepseek-chat'};
try{const d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD));if(d)db=normalize(d)}catch(e){}
try{const a=JSON.parse(localStorage.getItem(AIKEY));if(a)ai=a}catch(e){}
let cur=null,selMap={};
const toast=(m,err=true)=>{const t=$('#toast');t.style.background=err?'#c0392b':'#3a7d44';t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',4000)};
let termCache=null;
let lastSaveWarn=0,saveOk=true;
const save=()=>{
  termCache=null;
  try{localStorage.setItem(KEY,JSON.stringify(db));if(!saveOk){saveOk=true;showSaveBar()}}
  catch(e){
    const quota=e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014);
    let kb=0;try{kb=Math.round(JSON.stringify(db).length/1024)}catch(x){}
    saveOk=false;showSaveBar(quota?`浏览器给这个页面的存储空间用完了（当前项目约 ${kb} KB，一般上限约 5 MB）。图片占得最多：请换小一点的图，或删掉不用的图。先点「文件 → 导出文件」备份。`:'这个浏览器 / 打开方式不允许保存：你写的内容只在当前页面里，关掉就没了。常见原因：用了隐私窗口、关闭了网站数据，或者是在预览窗口里打开的。请用 Chrome / Edge 直接打开这个文件，并先点「文件 → 导出文件」备份。');
    if(Date.now()-lastSaveWarn>30000){lastSaveWarn=Date.now();toast(quota?'存储空间用完了，没能保存（详见页面顶部提示）':'当前打开方式不能保存（详见页面顶部提示）')}
  }
};
function showSaveBar(msg){
  let b=$('#savebar');
  if(!msg){if(b)b.remove();return}
  if(!b){b=document.createElement('div');b.id='savebar';const app=$('#app');app.insertBefore(b,app.firstChild)}
  b.textContent='⚠ '+msg;
}
const sheets=()=>db.sheets.filter(s=>!s.del).sort((a,b)=>a.order-b.order);
const listOf=s=>(s.kind==='tree'||s.kind==='map')?treeOrder(s.id):alive(s.id);
const sheetOf=id=>db.sheets.find(s=>s.id===id&&!s.del);
const alive=sid=>db.items.filter(i=>!i.del&&(!sid||i.sheet===sid)&&sheetOf(i.sheet)).sort((a,b)=>a.order-b.order);
const byId=id=>db.items.find(i=>i.id===id&&!i.del);
const touch=o=>{o.updatedAt=now()};
function newItem(sid,extra={}){
  const list=alive(sid),sh=sheetOf(sid);
  const proto=[...list].reverse().find(i=>i.fields.length);
  const it={id:uid(),sheet:sid,title:'',body:'',when:'',img:'',parent:'',order:Math.max(0,...list.map(i=>i.order))+1,updatedAt:now(),
    fields:sh.kind==='card'&&proto?proto.fields.map(f=>({k:f.k,v:''})):(sid==='s_code'?[{k:'指代',v:''},{k:'首次出现',v:''}]:[]),...extra};
  db.items.push(it);save();return it;
}
function reorder(sid,arr){arr.forEach((i,n)=>{if(i.order!==n+1){i.order=n+1;touch(i)}})}

// ---------- 引用 ----------
const named=()=>alive().filter(o=>o.title);
// 文字里出现「条目名 / 别名 / 代号」就自动关联，不用手动绑定、也不用写 @
const autoOn=s=>!!s&&(s.auto!==undefined?s.auto:(s.kind==='card'||s.kind==='map'));
function termList(){
  if(termCache)return termCache;
  const out=[];
  alive().forEach(o=>{
    if(!autoOn(sheetOf(o.sheet)))return;
    const names=[o.title,...(o.aliases||'').split(/[,，、;；\s]+/)].map(s=>(s||'').trim()).filter(s=>s.length>=2);
    new Set(names).forEach(n=>out.push({t:n,id:o.id}));
  });
  return termCache=out.sort((a,b)=>b.t.length-a.t.length);
}
function textMentions(text,selfId){
  const seen=new Map();text=String(text||'');
  termList().forEach(({t,id})=>{if(id!==selfId&&!seen.has(id)&&text.includes(t))seen.set(id,byId(id))});
  named().forEach(o=>{if(o.id!==selfId&&!seen.has(o.id)&&text.includes('@'+o.title))seen.set(o.id,o)});
  return [...seen.values()].filter(Boolean);
}
function mentions(it){return textMentions(it.body+' '+it.when+' '+it.fields.map(f=>f.v).join(' '),it.id)}
function backlinks(it){return alive().filter(o=>o.id!==it.id&&mentions(o).some(m=>m.id===it.id))}
function linkify(text,selfId){
  const s=String(text??''),pats=new Map();
  termList().forEach(x=>{if(x.id!==selfId&&!pats.has(x.t))pats.set(x.t,x.id)});
  named().forEach(o=>{if(o.id!==selfId)pats.set('@'+o.title,o.id)});
  const keys=[...pats.keys()].sort((a,b)=>b.length-a.length);
  if(!keys.length)return esc(s);
  const re=new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let out='',last=0,m;
  while((m=re.exec(s))){out+=esc(s.slice(last,m.index))+`<a class="go" data-go="${pats.get(m[0])}">${esc(m[0])}</a>`;last=m.index+m[0].length}
  return out+esc(s.slice(last));
}
function refsHtml(it){
  const chip=l=>l.length?l.map(o=>`<span class="ref" data-go="${o.id}">${esc(sheetOf(o.sheet).name)}｜${esc(o.title||'未命名')}</span>`).join(''):'无';
  return `文中提到：${chip(mentions(it))}<br>被这些条目提到：${chip(backlinks(it))}`;
}

// ---------- 锚点（跨页面链接，双向显示） ----------
function anchorsOf(it){
  const set=new Map();
  (it.links||[]).forEach(id=>{const o=byId(id);if(o)set.set(o.id,o)});
  alive().filter(o=>o.id!==it.id&&(o.links||[]).includes(it.id)).forEach(o=>set.set(o.id,o));
  return [...set.values()];
}
function anchHtml(it){
  const mine=anchorsOf(it),ids=new Set(mine.map(o=>o.id));
  const bcs=db.board.filter(n=>!n.del&&n.k==='n'&&sheetOf(n.sheet)&&(n.refs||(n.ref?[n.ref]:[])).includes(it.id)||textMentions(n.text||'',null).some(o=>o.id===it.id));
  const groups=sheets().map(s=>{
    const opts=alive(s.id).filter(o=>o.id!==it.id&&!ids.has(o.id));
    return opts.length?`<optgroup label="${esc(s.name)}">${opts.map(o=>`<option value="${o.id}">${esc(o.title||'未命名')}</option>`).join('')}</optgroup>`:'';
  }).join('');
  return `<div class="anch"><b>⚓ 锚点</b>
    <div class="ar">${(mine.length||bcs.length)?bcs.map(n=>`<span class="ref" data-gb="${n.id}">白板｜${esc((n.text||'卡片').slice(0,20))}</span>`).join('')+mine.map(o=>`<span><span class="ref" data-go="${o.id}">${esc(sheetOf(o.sheet).name)}｜${esc(o.title||'未命名')}</span><button class="ux" data-unlink="${o.id}" title="取消关联">×</button></span>`).join(''):'<span class="mute">还没有</span>'}</div>
    <div class="ar"><select data-addlink><option value="">＋ 关联已有条目…</option>${groups}</select>
    <select data-newlink><option value="">＋ 新建并关联到…</option>${sheets().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div>`;
}
function linkItems(a,b){
  if(!a||!b||a.id===b.id)return;
  if(!(a.links||[]).includes(b.id)){a.links=[...(a.links||[]),b.id];touch(a)}
  save();
}
function unlinkItems(a,b){
  [[a,b],[b,a]].forEach(([x,y])=>{if((x.links||[]).includes(y.id)){x.links=x.links.filter(i=>i!==y.id);touch(x)}});save();
}

// ---------- 图片 ----------
function toDataUrl(file,max=520){
  return new Promise((ok,no)=>{
    const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};
    im.onerror=()=>no();im.src=u;
  });
}
async function setImage(it,file,max){
  if(!file||!file.type.startsWith('image/'))return;
  try{it.img=await toDataUrl(file,max);touch(it);save();render(true)}catch(e){toast('这张图读不出来')}
}

// ---------- 渲染 ----------
function fieldsHtml(it){
  const labels=[...new Set(alive(it.sheet).flatMap(i=>i.fields.map(f=>f.k)).filter(Boolean))];
  return `<datalist id="fl">${labels.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>`+
    it.fields.map((f,n)=>`<div class="fld"><input class="fk" data-fk="${n}" list="fl" placeholder="属性名" value="${esc(f.k)}"><button class="fd" data-fdel="${n}" title="删除属性">×</button><textarea class="fv" rows="1" data-fv="${n}" placeholder="内容">${esc(f.v)}</textarea></div>`).join('')+
    `<button class="ghost" data-fadd>＋ 添加属性</button>`;
}
function imgHtml(it){
  return `<div class="imgbox ${it.img?'has':''}" data-pick>${it.img?`<img src="${it.img}" alt=""><button class="x" data-imgdel title="移除图片">✕</button>`:'点击选择 · 拖入 · 或直接粘贴图片'}</div>`;
}
function insertSelect(it){
  return `<select data-ins><option value="">插入 @引用…</option>${alive().filter(o=>o.id!==it.id&&o.title).map(o=>`<option value="${esc(o.title)}">${esc(sheetOf(o.sheet).name)}｜${esc(o.title)}</option>`).join('')}</select>`;
}
function editorHtml(it,tree){
  return `<div class="sheet" data-id="${it.id}">
    <div class="left">${imgHtml(it)}<div class="flabel">属性</div>${fieldsHtml(it)}</div>
    <div class="right"><div class="tools">${insertSelect(it)}<span class="sp"></span><button class="ghost" data-del>删除这${tree?'个节点':'条'}</button></div>
      ${tree?`<input class="when" data-f="when" placeholder="时间点（如：第3天 / 高二春 / 雨夜），可留空" value="${esc(it.when)}">`:''}
      ${tree?'':`<input class="when" data-f="aliases" placeholder="别名 / 代号（可留空，多个用逗号隔开）：文字里一写出来就自动关联到这一条" value="${esc(it.aliases||'')}">`}
      <input class="ttl" data-f="title" placeholder="${tree?'事件名':'名字'}" value="${esc(it.title)}">
      <textarea class="auto" data-f="body" placeholder="${tree?'这个事件发生了什么……':'文字描述……'}写出名字或代号会自动关联">${esc(it.body)}</textarea>
      ${anchHtml(it)}
      <div class="refs" data-refs>${refsHtml(it)}</div></div></div>`;
}
function cardHtml(sh){
  const list=alive(sh.id);let it=byId(selMap[sh.id]);if(!it||it.sheet!==sh.id)it=list[0];
  if(it)selMap[sh.id]=it.id;
  const strip=`<div class="strip">${list.map(i=>`<span class="chip ${it&&i.id===it.id?'on':''}" data-sel="${i.id}">${esc(i.title||'未命名')}</span>`).join('')}<span class="chip add" data-new>＋ 新建</span></div>`;
  if(!it)return strip+`<div class="empty">「${esc(sh.name)}」还是空的，点上面的「＋ 新建」开始。</div>`;
  return strip+editorHtml(it,false);
}

// ---------- 树状时间轴 ----------
const NW=176,NH=64,SX=NW+26,SY=NH+44;
const collapsed=new Set();
function treeLayout(sid,only,noFold){
  const list=alive(sid).filter(i=>!only||only.has(i.id)),ids=new Set(list.map(i=>i.id)),kids={};
  list.forEach(i=>{const p=ids.has(i.parent)&&i.parent!==i.id?i.parent:'';(kids[p]=kids[p]||[]).push(i)});
  const pos={};let row=0;
  const reach=new Set(),mark=i=>{if(reach.has(i.id))return;reach.add(i.id);(kids[i.id]||[]).forEach(mark)};
  (kids['']||[]).forEach(mark);
  const walk=(i,d)=>{
    if(pos[i.id])return;pos[i.id]={d};
    const ch=(kids[i.id]||[]).filter(c=>!pos[c.id]);
    if(!ch.length||(!noFold&&collapsed.has(i.id))){pos[i.id].y=row++;return}
    ch.forEach(c=>walk(c,d+1));
    const ys=ch.map(c=>pos[c.id]).filter(p=>p&&p.y!=null).map(p=>p.y);
    pos[i.id].y=ys.length?(Math.min(...ys)+Math.max(...ys))/2:row++;
  };
  (kids['']||[]).forEach(r=>walk(r,0));
  list.filter(i=>!reach.has(i.id)).forEach(i=>walk(i,0));
  const count=i=>(kids[i.id]||[]).reduce((n,c)=>n+1+count(c),0);
  return {pos,kids,rows:row,count,list,reach};
}
function treeOrder(sid){
  const L=treeLayout(sid),out=[],seen=new Set();
  const dfs=i=>{if(seen.has(i.id))return;seen.add(i.id);out.push(i);(L.kids[i.id]||[]).forEach(dfs)};
  (L.kids['']||[]).forEach(dfs);L.list.forEach(dfs);return out;
}
function nodeHtml(it,L,sel,attr='data-tn',noFold){
  const p=L.pos[it.id],hid=!noFold&&collapsed.has(it.id)?L.count(it):0;
  return `<div class="tn ${it.id===sel?'sel':''}" ${attr}="${it.id}" style="left:${12+p.y*SX}px;top:${12+p.d*SY}px" title="${noFold?'点击查看这件事':'单击选中，双击折叠/展开分支'}">
    ${it.img?`<img src="${it.img}" alt="">`:''}<div class="tx"><i>${esc(it.when||'　')}</i><b>${esc(it.title||'未命名')}</b></div>${anchorsOf(it).length?`<span class="ab">⚓${anchorsOf(it).length}</span>`:''}${hid?`<span class="cb">▸ 折叠 ${hid}</span>`:''}</div>`;
}
// 画一块树状图：only 限定显示哪些节点，attr 是节点上的点击标记
function canvasHtml(sh,sel,only,attr,noFold){
  const L=treeLayout(sh.id,only,noFold),list=L.list;
  const visible=list.filter(i=>L.pos[i.id]&&L.pos[i.id].y!=null);
  if(!visible.length)return '';
  const W=Math.max(...visible.map(i=>L.pos[i.id].y))*SX+NW+24,H=Math.max(...visible.map(i=>L.pos[i.id].d))*SY+NH+24;
  let edges='';
  visible.forEach(i=>{const p=L.pos[i.id],par=only&&!only.has(i.parent)?null:byId(i.parent);if(!par||par.sheet!==sh.id||par.id===i.id)return;const q=L.pos[par.id];if(!q||q.y==null)return;
    const x1=12+q.y*SX+NW/2,y1=12+q.d*SY+NH,x2=12+p.y*SX+NW/2,y2=12+p.d*SY,m=(y1+y2)/2;
    edges+=`<path class="${sel&&i.id===sel?'hot':''}" d="M${x1},${y1} C${x1},${m} ${x2},${m} ${x2},${y2}"/>`});
  return `<div class="canvas"><div class="cin" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}">${edges}</svg>${visible.map(i=>nodeHtml(i,L,sel,attr,noFold)).join('')}</div></div>`;
}

}

function branchOf(it){

    row.sort((a,b)=>{const pa=es.filter(e=>e.b===a).map(e=>xs[e.a]).filter(v=>v!=null),pb=es.filter(e=>e.b===b).map(e=>xs[e.a]).filter(v=>v!=null);
      const ma=pa.length?Math.min(...pa):1e9,mb=pb.length?Math.min(...pb):1e9;return ma-mb});

  }

function bAutoLayout(){

function bImportTimeline(){
  const ts=sheets().find(s=>s.kind==='tree');if(!ts)return bsay('a','还没有时间轴页。');
  const items=treeOrder(ts.id);if(!items.length)return bsay('a','时间轴还是空的。');
  const have=new Set(belems(curBoard,'n').flatMap(refsOf));
  const fresh=items.filter(i=>!have.has(i.id));if(!fresh.length)return bsay('a','时间轴上的事件已经都在白板上了。');
  bpush();const map={};
  fresh.forEach(i=>{map[i.id]=bnew('n',{x:0,y:0,w:170,text:i.title||'未命名',refs:[i.id],c:CARD_C[0]})});
  const cardOf=id=>belems(curBoard,'n').find(n=>refsOf(n).includes(id));
  fresh.forEach(i=>{const pc=cardOf(i.parent),cc=map[i.id];if(pc&&cc&&pc.id!==cc.id&&!hasEdge(pc.id,cc.id))bnew('e',{a:pc.id,b:cc.id})});
  layoutCards(Object.values(map).map(n=>n.id));save();bdraw();bfit();
  bsay('a',`已把时间轴上的 ${fresh.length} 个事件放上白板，并按分支连好线。每张卡片都挂着对应事件的锚点，点一下就跳过去。`);

async function bAiDraw(ask){

    const r=parseJson(t);

    (r.cards||[]).slice(0,12).forEach(c=>{
      const it=findItem(c.ref),n=bnew('n',{x:0,y:0,w:170,text:String(c.text||'').slice(0,60),refs:it?[it.id]:[],c:CARD_C[Math.min(5,Math.max(0,parseInt(c.color)||0))]});
      keyMap[c.key]=n.id;made.push(n.id)});

    if(made.length)layoutCards(made);
    save();bdraw();if(made.length)bfit();
    bsayLast(`${r.say||'画好了'}\n（新增 ${made.length} 张卡片、${ec} 条连线，Ctrl+Z 可撤销）`);
    logChange('AI（白板小助手）',`在白板「${sheetOf(curBoard)?sheetOf(curBoard).name:''}」新增 ${made.length} 张卡片、${ec} 条连线（要撤销请在白板按 Ctrl+Z）`,[]);
  }catch(e){bsayLast('没画成：'+e.message)}
}

async function composeMap(o,kids){

  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');

  const rad=Math.max(13,W/55);g.font=`bold ${Math.round(rad*1.1)}px sans-serif`;g.textBaseline='middle';
  kids.forEach((k,i)=>{
    const x=k.px/100*W,y=k.py/100*H,name=k.title||'未命名';
    g.beginPath();g.arc(x,y,rad,0,7);g.fillStyle=STC[stIdx(k)];g.fill();g.lineWidth=3;g.strokeStyle='#fff';g.stroke();

function parseJson(t){
  try{return JSON.parse(t)}catch(e){
    const m=String(t).match(/\{[\s\S]*\}/);
    if(m){try{return JSON.parse(m[0])}catch(e2){}}
    throw new Error('AI 返回的不是有效的 JSON，请再试一次');
  }
}
async function callAI(user,json,opts={}){
  if(!ai.key){openApi();throw new Error('请先在「API 设置」里填密钥')}
  const url=(ai.base||AI_DEFAULT.base).replace(/\/+$/,'')+'/chat/completions';
  const sys=opts.system??('你是协助两位作者做剧情策划的编辑。用简体中文，具体简洁，不说空话。\n'+context());
  const body={model:ai.model,temperature:opts.temp??ai.temp,messages:[{role:'system',content:sys},{role:'user',content:user}]};
  const mt=opts.maxTokens||(ai.maxTokens?+ai.maxTokens:0);if(mt)body.max_tokens=mt;
  if(json&&ai.json)body.response_format={type:'json_object'};
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ai.key},body:JSON.stringify(body)})}
  catch(e){usage.errs++;updUsage();throw new Error('连不上接口（网络、地址或跨域问题）：'+e.message)}
  if(!r.ok){usage.errs++;updUsage();throw new Error(`接口返回 ${r.status}${HINTS[r.status]?'：'+HINTS[r.status]:''} ${(await r.text()).slice(0,160)}`)}
  const j=await r.json();usage.calls++;usage.pin+=(j.usage&&j.usage.prompt_tokens)||0;usage.pout+=(j.usage&&j.usage.completion_tokens)||0;updUsage();
  return j.choices[0].message.content;
}

function logChange(src,summary,ops){

const fmtT=t=>new Date(t).toLocaleString('zh-CN',{hour12:false});
function logHtml(){
  const L=db.log||[];
  if(!L.length)return '<p class="mute">还没有记录。AI 帮你改了什么、导入合并了什么，都会记在这里。</p>';
  return L.map(e=>`<div class="lg ${e.undone?'undone':''}"><div><b>${esc(e.src)}</b> <span class="mute">${fmtT(e.t)}</span>${e.undone?' <span class="mute">（已撤销）</span>':''}</div>
    <div>${esc(e.summary)}</div>

    ${e.ops.length&&!e.undone?`<button data-undo="${e.id}">撤销这一批</button>`:''}</div>`).join('');
}

function undoLog(id){
  const e=(db.log||[]).find(x=>x.id===id);if(!e||e.undone)return;
  e.ops.forEach(o=>{
    const it=db.items.find(i=>i.id===o.id);if(!it)return;
    if(o.op==='add'){it.del=true;touch(it)}
    else if(o.op==='edit'){it[o.field]=o.before;touch(it)}
  });
  e.undone=true;save();render(true);$('#lgList').innerHTML=logHtml();toast('已撤销这一批改动',false);
}

function buildProposals(r){
  const P=[],miss=[];
  const S={ev:pickSheet('s_event','时间轴','tree'),ch:pickSheet('s_char','人设'),pl:pickSheet('s_place','地图','map'),cd:pickSheet('s_code','代号'),cg:pickSheet('s_log','CG')};
  const add=(kind,key,tag,list,mk)=>{
    const sh=S[key];
    (Array.isArray(list)?list:[]).forEach(c=>{
      if(!c||!String(c.title||'').trim())return;
      const title=String(c.title).trim();
      if(!sh){const m=`没有「${tag}」页，已跳过「${title}」`;if(!miss.includes(m))miss.push(m);return}
      const dup=alive(sh.id).find(i=>i.title===title);
      P.push({kind,sheet:sh.id,title,tag,data:c,skip:!!dup,label:dup?`「${title}」已经有了，不重复新增`:mk(title,c)});
    });
  };
  add('event','ev','时间轴',r.events,(t,c)=>`新增事件「${t}」${c.after?`，接在「${c.after}」之后`:'（作为新的起点）'}`);
  add('char','ch','人设',r.characters,t=>`新增人设「${t}」`);
  add('place','pl','地图',r.places,(t,c)=>`新增地点「${t}」${c.parent?`（在「${c.parent}」里面）`:'（顶层）'}`);
  add('code','cd','代号',r.codes,(t,c)=>`新增代号「${t}」${c.means?` → ${c.means}`:''}`);
  add('cg','cg','CG',r.cgs,t=>`新增 CG「${t}」`);
  (r.edits||[]).forEach(e=>{
    const tg=alive().find(i=>i.title===String(e.target||'').trim()),ap=String(e.append||'').trim();
    if(!tg||!ap)return;
    P.push({kind:'edit',id:tg.id,title:tg.title,tag:'补充',data:{append:ap,reason:e.reason},label:`给「${tg.title}」的描述补充一段${e.reason?`（${e.reason}）`:''}`});
  });
  P.notes=miss;return P;
}
const pvText=p=>p.kind==='edit'?p.data.append:[p.data.when,p.data.body||p.data.means,p.data.aliases?'别名：'+p.data.aliases:''].filter(Boolean).join(' ｜ ').slice(0,140);
function openReview(sum,trunc){
  $('#rvSum').textContent=(sum||'')+(trunc?'（文稿太长，只处理了前 12000 字）':'');
  $('#rvList').innerHTML=rvProps.length?rvProps.map((p,i)=>`<label class="rv ${p.skip?'skip':''}"><input type="checkbox" data-pi="${i}" ${p.skip?'disabled':'checked'}><span><span class="tg">${esc(p.tag)}</span> ${esc(p.label)}<div class="mute">${esc(pvText(p))}</div></span></label>`).join(''):'<p class="mute">AI 没有从这段文字里找到可以补充的内容。</p>';

}

$('#rvApply').onclick=()=>{

  $('#dlgReview').close();
  if(!picked.length)return toast('没有勾选任何改动，策划没有变化',false);
  applyProposals(picked);
};
function applyProposals(P){
  const ops=[],made={};let nAdd=0,nEdit=0;
  const parentId=(sid,key,title)=>{if(!title)return '';const t=String(title).trim();return made[key+':'+t]||(alive(sid).find(i=>i.title===t)||{}).id||''};
  P.forEach(p=>{
    const d=p.data;let it=null;
    if(p.kind==='event')it=newItem(p.sheet,{title:p.title,when:d.when||'',body:d.body||'',parent:parentId(p.sheet,'event',d.after)});
    else if(p.kind==='char')it=newItem(p.sheet,{title:p.title,body:d.body||'',aliases:d.aliases||'',fields:(Array.isArray(d.fields)?d.fields:[]).filter(f=>f&&f.k).map(f=>({k:String(f.k),v:String(f.v||'')}))});
    else if(p.kind==='place')it=newItem(p.sheet,{title:p.title,body:d.body||'',parent:parentId(p.sheet,'place',d.parent),status:'待画'});
    else if(p.kind==='code')it=newItem(p.sheet,{title:p.title,body:d.body||'',fields:[{k:'指代',v:d.means||''},{k:'首次出现',v:''}]});
    else if(p.kind==='cg')it=newItem(p.sheet,{title:p.title,body:d.body||''});
    else if(p.kind==='edit'){
      const t=byId(p.id);if(!t)return;
      const before=t.body||'';t.body=before+(before?'\n':'')+d.append;touch(t);save();
      ops.push({op:'edit',id:t.id,field:'body',before,label:`给「${t.title}」补充描述：${String(d.append).slice(0,40)}`});nEdit++;return;
    }
    if(it){made[p.kind+':'+p.title]=it.id;ops.push({op:'add',id:it.id,label:p.label});nAdd++}
  });
  save();
  logChange(`AI（从文稿「${rvFrom}」提取）`,`新增 ${nAdd} 项，补充 ${nEdit} 处。你勾选确认后才写入。`,ops);
  render(true);
  toast(`已应用：新增 ${nAdd} 项，补充 ${nEdit} 处。已记入「修改记录」，可整批撤销。`,false);
}

const TL={};try{Object.assign(TL,JSON.parse(localStorage.getItem('storyplanner.tl')||'{}'))}catch(e){}
const saveTL=()=>{try{localStorage.setItem('storyplanner.tl',JSON.stringify(TL))}catch(e){}};
const isScriptText=t=>/\[(场景|结局)\s+[^\]]+\]/.test(t||'');
function tlState(sh,list){
  const s=TL[sh.id]||(TL[sh.id]={split:true,ratio:.5});
  if(s.ratio==null)s.ratio=.5;
  if(!list.some(d=>d.id===s.left)){const sel=byId(selMap[sh.id]);s.left=(sel&&sel.sheet===sh.id)?sel.id:(list[0]?list[0].id:'')}
  selMap[sh.id]=s.left;
  const other=list.find(d=>d.id!==s.left),left=byId(s.left);
  if(s.right===undefined)s.right=left&&isScriptText(left.body)?'play':(other?other.id:'none');
  if(!['chk','play','none'].includes(s.right)&&(!list.some(d=>d.id===s.right)||s.right===s.left))s.right=other?other.id:'none';
  return s;
}
function paneSelect(side,list,s){
  const cur_=side==='left'?s.left:s.right;
  const docs=list.filter(d=>side==='left'||d.id!==s.left).map(d=>`<option value="${d.id}" ${d.id===cur_?'selected':''}>${esc(d.title||'未命名文稿')}</option>`).join('');
  const modes=side==='right'?`<option value="play" ${cur_==='play'?'selected':''}>▶ 试玩（玩左边的剧本）</option><option value="chk" ${cur_==='chk'?'selected':''}>检查与数值</option><option value="none" ${cur_==='none'?'selected':''}>（空）</option>`:'';
  return `<select class="psel" data-tl="${side}">${docs}${modes}<option value="__new">＋ 新建一篇…</option></select>`;
}
function modeBody(s,left){
  if(s.right==='none')return '<div class="empty" style="padding:50px 0">在上面的下拉框里选：另一篇文稿（比如笔记）、▶ 试玩，或检查与数值。</div>';
  scDoc=left;
  if(s.right==='chk')return scHtml('chk');
  const S=parseScript(left.body);
  if(!S.scenes.length)return '<p class="mute">左边还不是剧本格式。写上 <code>[场景 名字]</code> 就能在这里试玩。</p>';
  if(!PL||PL.src===undefined){playStart(S);PL.src=left.body}
  return (PL.src!==left.body?'<div class="iss warn">左边的剧本改过了：<button data-pc="reload">↻ 用最新剧本重开</button></div>':'')+playHtml();
}
function docPaneHtml(it,sh,side,list,s){
  const script=isScriptText(it.body);
  const tools=script
    ?`<div class="stools"><span class="mute">剧本</span><button data-sc="chk">检查与数值</button><button data-sc="play">▶ 试玩</button><button data-sc="board">画成分支图</button><button class="ghost" data-sc="fmt">格式</button></div>`
    :(side==='left'?`<div class="stools"><span class="mute">要写文字游戏？</span><button data-sc="fmt">看格式和示例</button></div>`:'');
  return `<div class="pane" data-id="${it.id}"><div class="tools" style="margin-bottom:6px">${paneSelect(side,list,s)}<span class="sp"></span><button class="pri" data-ai="extract">AI 提取</button><button class="ghost" data-del title="删除这篇">删除</button></div>
    <input class="ttl" data-f="title" placeholder="标题" value="${esc(it.title)}" style="font-size:19px;margin-bottom:6px">
    ${tools}

    <div class="refs" data-refs>${refsHtml(it)}</div></div>`;

function textHtml(sh){
  const list=alive(sh.id);
  if(!list.length)return `<div class="empty">这里是纯文本写作区，可以左右分两栏：左边写正文，右边放笔记。<br><br><button class="pri" data-new>＋ 新建文稿</button></div>`;
  const s=tlState(sh,list),left=byId(s.left);
  const bar=`<div class="tlbar"><span class="mute">${s.split?'左右两栏：左边写，右边放笔记 / 试玩 / 检查（中间的线可以拖）':''}</span><span class="sp"></span><button data-tl-split>${s.split?'改成单栏':'分成两栏'}</button></div>`;
  if(!s.split)return bar+`<div class="tsplit one">${docPaneHtml(left,sh,'left',list,s)}</div>`;
  const right=byId(s.right);
  const rp=right?docPaneHtml(right,sh,'right',list,s)
    :`<div class="pane"><div class="tools" style="margin-bottom:6px">${paneSelect('right',list,s)}</div><div id="rpBody">${modeBody(s,left)}</div></div>`;
  return bar+`<div class="tsplit" style="grid-template-columns:${s.ratio}fr 10px ${1-s.ratio}fr">${docPaneHtml(left,sh,'left',list,s)}<div class="gutter" id="tgut" title="拖动调整左右宽度"></div>${rp}</div>`;
}
let rfT=null;

const FMT_ROWS=[

const NUMRE='(-?\\d+(?:\\.\\d+)?)';
const EFFRE=new RegExp('^(.+?)\\s*([+\\-＋－=＝])\\s*'+NUMRE+'$');
const CONDRE=new RegExp('^(.+?)\\s*(>=|<=|!=|==|>|<|=)\\s*'+NUMRE+'$');
const splitList=s=>String(s).split(/[,，、;；]/).map(x=>x.trim()).filter(Boolean);
function parseEffects(s){return splitList(s).map(x=>{const m=x.match(EFFRE);return m?{v:m[1].trim(),op:m[2].replace('＋','+').replace('－','-').replace('＝','='),n:+m[3]}:{bad:x}})}
function parseConds(s){return splitList(s).map(x=>{const m=x.match(CONDRE);return m?{v:m[1].trim(),op:m[2]==='='?'==':m[2],n:+m[3]}:{bad:x}})}
const fmtEff=e=>`${e.v}${e.op}${e.n}`;
const fmtCond=c=>`${c.v}${c.op==='=='?'=':c.op}${c.n}`;
function parseScript(text){
  const S={vars:{},scenes:[],issues:[]};let sc=null,ln=0;
  const bad=(msg,line)=>S.issues.push({level:'err',msg:`第 ${line} 行：${msg}`});
  String(text||'').split(/\r?\n/).forEach(raw=>{
    ln++;const l=raw.trim();if(!l||l.startsWith('//'))return;let m;
    if((m=l.match(new RegExp('^\\$\\s*(\\S+?)\\s*[=＝]\\s*'+NUMRE+'$')))){S.vars[m[1]]=+m[2];return}
    if((m=l.match(/^\[(场景|结局)\s+([^\]]+)\]$/))){sc={key:m[2].trim(),ending:m[1]==='结局',meta:{},lines:[],enter:[],choices:[],goto:null,gotoEff:[],line:ln};S.scenes.push(sc);return}
    if(!sc){bad('这一行出现在第一个 [场景 …] 之前，会被忽略',ln);return}
    if(l.startsWith('~')){parseEffects(l.slice(1)).forEach(e=>e.bad?bad(`看不懂的数值变化「${e.bad}」`,ln):sc.enter.push(e));return}
    if(l.startsWith('*')){
      const mm=l.slice(1).match(/^\s*(.+?)\s*->\s*(.+)$/);
      if(!mm){bad('选项要写成「* 文字 -> 目标场景」',ln);return}
      const parts=mm[2].split('|').map(x=>x.trim()),ch={text:mm[1].trim(),to:parts[0],eff:[],cond:[]};
      parts.slice(1).forEach(p=>{
        if(/^(需要|如果|条件)/.test(p))parseConds(p.replace(/^(需要|如果|条件)[:：]?\s*/,'')).forEach(c=>c.bad?bad(`看不懂的条件「${c.bad}」`,ln):ch.cond.push(c));
        else parseEffects(p).forEach(e=>e.bad?bad(`看不懂的数值变化「${e.bad}」`,ln):ch.eff.push(e));
      });
      sc.choices.push(ch);return;
    }
    if(l.startsWith('->')){
      const parts=l.slice(2).split('|').map(x=>x.trim());sc.goto=parts[0];
      parts.slice(1).forEach(p=>parseEffects(p).forEach(e=>e.bad?bad(`看不懂的数值变化「${e.bad}」`,ln):sc.gotoEff.push(e)));return;
    }
    if((m=l.match(/^(背景|音乐|地点|立绘|CG)\s*[:：]\s*(.*)$/))){sc.meta[m[1]]=m[2];return}
    if((m=l.match(/^([^\s:：*\->~\[\]$\/][^:：]{0,15})\s*[:：]\s*(.+)$/))){sc.lines.push({who:m[1].trim(),text:m[2].trim()});return}
    sc.lines.push({who:'旁白',text:l});
  });
  return S;
}
function checkScript(S){
  const out=[...S.issues],keys=new Set(S.scenes.map(s=>s.key));
  if(!S.scenes.length)return [{level:'err',msg:'还没有任何场景。用 [场景 名字] 开始。'}];
  const seenKey={};S.scenes.forEach(s=>{if(seenKey[s.key])out.push({level:'err',msg:`场景名「${s.key}」重复了`});seenKey[s.key]=1});
  const edges=[];
  S.scenes.forEach(s=>{
    s.choices.forEach(c=>{edges.push([s.key,c.to]);if(!keys.has(c.to))out.push({level:'err',msg:`场景「${s.key}」的选项「${c.text}」跳到不存在的场景「${c.to}」`})});
    if(s.goto){edges.push([s.key,s.goto]);if(!keys.has(s.goto))out.push({level:'err',msg:`场景「${s.key}」跳到不存在的场景「${s.goto}」`})}
    if(!s.ending&&!s.choices.length&&!s.goto)out.push({level:'warn',msg:`场景「${s.key}」没有出口：没有选项、没有 -> 跳转，也不是结局`});
  });
  const seen=new Set([S.scenes[0].key]),q=[S.scenes[0].key];
  while(q.length){const a=q.shift();edges.filter(e=>e[0]===a).forEach(e=>{if(keys.has(e[1])&&!seen.has(e[1])){seen.add(e[1]);q.push(e[1])}})}
  S.scenes.forEach(s=>{if(!seen.has(s.key))out.push({level:'warn',msg:`场景「${s.key}」从起点永远走不到`})});
  const T=varTable(S);
  Object.keys(T).forEach(v=>{
    if(!(v in S.vars))out.push({level:'warn',msg:`数值「${v}」没有在开头声明初始值（按 0 算）：写一行 $${v} = 0`});
    T[v].cond.forEach(c=>{
      if(((c.op==='>='&&c.n>T[v].max)||(c.op==='>'&&c.n>=T[v].max)))out.push({level:'warn',msg:`条件「${fmtCond(c)}」可能永远满足不了：「${v}」最多只能加到约 ${T[v].max}`});
    });
  });
  return out;
}
function varTable(S){
  const T={},get=v=>T[v]||(T[v]={init:S.vars[v]??0,up:[],down:[],set:[],cond:[],min:S.vars[v]??0,max:S.vars[v]??0});
  Object.keys(S.vars).forEach(get);
  const addEff=(e,where)=>{const t=get(e.v);
    if(e.op==='+'){t.up.push(`${where} +${e.n}`);t.max+=e.n}
    else if(e.op==='-'){t.down.push(`${where} -${e.n}`);t.min-=e.n}
    else{t.set.push(`${where} =${e.n}`);t.max=Math.max(t.max,e.n);t.min=Math.min(t.min,e.n)}};
  S.scenes.forEach(s=>{
    s.enter.forEach(e=>addEff(e,`「${s.key}」进入时`));
    s.choices.forEach(c=>{c.eff.forEach(e=>addEff(e,`「${s.key}」选「${c.text.slice(0,10)}」`));c.cond.forEach(k=>get(k.v).cond.push(k))});
    s.gotoEff.forEach(e=>addEff(e,`「${s.key}」之后`));
  });
  return T;
}
// ---- 试玩 ----
let PL=null;
const evalCond=(c,vars)=>{const x=vars[c.v]??0;return c.op==='>='?x>=c.n:c.op==='<='?x<=c.n:c.op==='>'?x>c.n:c.op==='<'?x<c.n:c.op==='!='?x!==c.n:x===c.n};
const applyEff=(effs,vars)=>effs.map(e=>{const old=vars[e.v]??0;vars[e.v]=e.op==='+'?old+e.n:e.op==='-'?old-e.n:e.n;return {v:e.v,d:vars[e.v]-old}});
function playStart(S){
  PL={S,vars:{...S.vars},hist:[],ch:[],scene:null};
  Object.keys(varTable(S)).forEach(v=>{if(!(v in PL.vars))PL.vars[v]=0});
  playEnter(S.scenes[0].key);
}
function playEnter(key){
  const sc=PL.S.scenes.find(s=>s.key===key);
  if(!sc){PL.scene=null;PL.err=`找不到场景「${key}」`;return}
  PL.err='';PL.scene=sc;PL.ch=PL.ch.concat(applyEff(sc.enter,PL.vars));
}
function playPush(){PL.hist.push({vars:{...PL.vars},scene:PL.scene,ch:[...PL.ch],err:PL.err})}
function playHtml(){
  if(!PL)return '';
  const S=PL.S,sc=PL.scene,vs=Object.keys(PL.vars);
  const nums=vs.length?`<div class="pvv">${vs.map(v=>{const d=PL.ch.filter(c=>c.v===v).reduce((a,c)=>a+c.d,0);return `<span class="pvn"><b>${esc(v)}</b> ${PL.vars[v]}${d?` <em class="${d>0?'up':'dn'}">${d>0?'+':''}${d}</em>`:''}</span>`}).join('')}</div>`:'';
  let body='';
  if(!sc)body=`<p class="mute">${esc(PL.err||'游戏结束')}</p>`;
  else{
    body=`<h4>${esc(sc.key)}</h4>${Object.keys(sc.meta).length?`<div class="mute">${Object.entries(sc.meta).map(([k,v])=>`${esc(k)}：${esc(v)}`).join('　')}</div>`:''}`+
      sc.lines.map(l=>l.who==='旁白'?`<p class="nar">${esc(l.text)}</p>`:`<p><b>${esc(l.who)}</b>：${esc(l.text)}</p>`).join('');
    if(sc.ending)body+=`<div class="pend">— 结局：${esc(sc.key)} —</div>`;
    else if(sc.choices.length)body+=`<div class="pch">${sc.choices.map((c,i)=>{const miss=c.cond.filter(k=>!evalCond(k,PL.vars)),eff=c.eff.map(fmtEff).join(' ');
      return `<button data-pc="${i}" ${miss.length?'disabled':''}>${esc(c.text)}${eff&&!miss.length?` <small>${esc(eff)}</small>`:''}${miss.length?` <small>🔒 需要 ${esc(miss.map(fmtCond).join('，'))}</small>`:''}</button>`}).join('')}</div>`;
    else if(sc.goto)body+=`<div class="pch"><button data-pc="go">继续 →</button></div>`;
    else body+=`<p class="mute">（这个场景没有出口，试玩到此为止）</p>`;
  }
  return nums+`<div class="pvs">${body}</div><div class="pvt"><button data-pc="back" ${PL.hist.length?'':'disabled'}>← 上一步</button> <button data-pc="restart">重新开始</button></div>`;
}
function playClick(k){
  if(k==='restart')return playStart(PL.S);
  if(k==='back'){const h=PL.hist.pop();if(h){PL.vars=h.vars;PL.scene=h.scene;PL.ch=h.ch;PL.err=h.err}return}
  const sc=PL.scene;if(!sc)return;
  playPush();PL.ch=[];
  if(k==='go'){PL.ch=PL.ch.concat(applyEff(sc.gotoEff,PL.vars));playEnter(sc.goto)}
  else{const c=sc.choices[+k];if(!c)return;PL.ch=PL.ch.concat(applyEff(c.eff,PL.vars));playEnter(c.to)}

// ---- 弹窗：格式 / 检查 / 试玩 ----
let scDoc=null,scTab='fmt';
function scHtml(tab){

    <div style="margin-top:12px"><button class="pri" data-scx="sample">插入示例剧本（新建一篇文稿）</button> <button data-scx="tpl">把空模板加到当前文稿末尾</button></div>`;

      <p class="mute">共 ${S.scenes.length} 个场景，${S.scenes.filter(s=>s.ending).length} 个结局，${S.scenes.reduce((a,s)=>a+s.choices.length,0)} 个选项。</p>
      <h4>数值一览</h4>${vs.length?`<table class="fmt"><tr><th>数值</th><th>初始</th><th>粗略范围</th><th>在哪里变化 / 被哪里要求</th></tr>${vs.map(v=>{const t=T[v];return `<tr><td><b>${esc(v)}</b></td><td>${t.init}</td><td>${t.min} ~ ${t.max}</td><td>${[...t.up,...t.down,...t.set].map(esc).join('<br>')||'<span class="mute">没有变化</span>'}${t.cond.length?`<div class="mute">条件：${t.cond.map(c=>esc(fmtCond(c))).join('，')}</div>`:''}</td></tr>`}).join('')}</table><p class="mute">范围是把所有加减加在一起的粗估，实际玩的时候走不满。</p>`:'<p class="mute">还没有用到数值。</p>'}`;

}

function genScriptBoard(doc,silent){
  const S=parseScript(doc.body);if(!S.scenes.length)return toast('文稿里还没有场景，先用 [场景 名字] 写起来',false);
  let bs=sheets().find(s=>s.kind==='board');
  if(!bs){bs={id:uid(),name:'白板',kind:'board',order:Math.max(0,...db.sheets.map(x=>x.order))+1,updatedAt:now()};db.sheets.push(bs)}
  const prev=curBoard;curBoard=bs.id;bpush();
  const tag='script:'+doc.id,keys=new Set(S.scenes.map(s=>s.key));
  const old=belems(bs.id,'n').filter(n=>n.gen===tag),keep={};old.forEach(n=>keep[n.sk]=n);
  belems(bs.id,'e').filter(e=>e.gen===tag).forEach(e=>{e.del=true;touch(e)});
  old.forEach(n=>{if(!keys.has(n.sk)){n.del=true;touch(n)}});
  // 颜色：起点蓝、结局绿、没出口红、走不到的灰白，其余黄
  const iss=checkScript(S),dead=new Set(),lost=new Set();

  const ids={},fresh=[];
  S.scenes.forEach((sc,i)=>{
    const ci=i===0?2:sc.ending?3:dead.has(sc.key)?1:lost.has(sc.key)?5:0;
    let n=keep[sc.key];
    if(n){n.text=sc.key;n.c=CARD_C[ci];touch(n)}
    else{n=bnew('n',{x:0,y:0,w:170,text:sc.key,c:CARD_C[ci],gen:tag,sk:sc.key});fresh.push(n.id)}
    ids[sc.key]=n.id;
  });
  const pair={};
  const addE=(a,to,label)=>{const b=ids[to];if(!b||a===b)return;const k=a+'>'+b;if(pair[k]){pair[k].label=(pair[k].label?pair[k].label+' / ':'')+label;return}pair[k]=bnew('e',{a,b,label,gen:tag})};
  S.scenes.forEach(sc=>{
    sc.choices.forEach(c=>addE(ids[sc.key],c.to,(c.text.length>8?c.text.slice(0,8)+'…':c.text)+(c.eff.length?' '+c.eff.map(fmtEff).join(' '):'')+(c.cond.length?' 🔒':'')));
    if(sc.goto)addE(ids[sc.key],sc.goto,sc.gotoEff.map(fmtEff).join(' '));
  });
  layoutCards(old.length?fresh:Object.values(ids),old.length?undefined:60,old.length?undefined:40);
  curBoard=prev;save();
  if(!silent){cur=bs.id;render();bfit();toast(`已画成分支图：${S.scenes.length} 个场景。蓝=起点 绿=结局 红=没出口 灰=走不到`,false)}
}
// ---------- 小对话框 / 新手教程 / 示例项目 ----------
function askText(title,val,cb){
  const d=$('#dlgText'),inp=$('#dtIn');$('#dtTitle').textContent=title;inp.value=val||'';d.returnValue='';
  d.onclose=()=>{if(d.returnValue==='ok')cb(inp.value.trim())};
  d.showModal();inp.focus();inp.select();
}
function editEdgeLabel(id){
  const ed=bget(id);if(!ed)return;
  askText('连线上的文字（比如选项内容）',ed.label,v=>{bpush();ed.label=v;touch(ed);save();bedges()});
}
function goSheetKind(kind){
  const s=sheets().find(x=>x.kind===kind);if(!s)return toast('这个项目里还没有这种页面，可以点底部「＋ 新页面」添加',false);
  $('#dlgTour').close();cur=s.id;render();
}
const TOUR=[
  {t:'欢迎',b:'这是一个两个人一起做故事策划的小工具。\n文稿、人设、地图、时间轴、CG、白板，各管一件事。写出人物、地点的名字，别处就会自动关联，不用手动绑定。\n所有内容只存在你的浏览器里；想让对方看，导出文件发过去就行。',btn:'载入示例项目（推荐，边看边学）',fn:()=>{$('#dlgTour').close();loadSample()}},
  {t:'第 1 步：先写文稿',b:'最左边的「文稿」页是纯文本，灵感、设定、大纲直接写。页面分成左右两栏：左边写正文，右边放笔记，或者实时试玩、检查剧本。\n要做文字游戏（有对话、选项分支、数值）？按剧本格式写：能检查错误、直接试玩、一键画成分支图。',btn:'去文稿页',fn:()=>goSheetKind('text')},
  {t:'第 2 步：让 AI 帮你整理',b:'先到右上角 ⚙ → API 设置 填密钥。\n回到文稿页点「AI 提取并补全策划」：AI 先列出想新增的事件、人物、地点，你勾选确认后才写入。每次改动都记在「文件 → 修改记录」，能整批撤销。',btn:'打开 API 设置',fn:()=>{$('#dlgTour').close();openApi()}},
  {t:'第 3 步：时间轴',b:'从上到下是事件先后，横向分开的是不同支线。\n点一张卡片，在下面写详情；选中后用「＋ 后续事件」「＋ 并行分支」往下长。双击卡片可以折叠一整条分支。',btn:'去时间轴',fn:()=>goSheetKind('tree')},
  {t:'第 4 步：地图',b:'底图上放圆点，点进圆点写描述、放画面，里面还能继续放点，一层层细化。\n圆点颜色是出图状态。「导出给美术」会生成一份美术能直接打开的需求单。',btn:'去地图',fn:()=>goSheetKind('map')},
  {t:'第 5 步：白板',b:'自由画布。拖空白处框选，松手点「框起来」变方框；右键卡片、方框、连线都有菜单；连线可以写字（比如选项内容）。\n右边的小助手能直接帮你画，也能把文稿里的剧本一键画成分支图。',btn:'去白板',fn:()=>goSheetKind('board')},
  {t:'第 6 步：自动关联与锚点',b:'条目名、「别名」里写的称呼，只要出现在任何文字里，就会变成可点的链接。\n条目下面的「⚓ 锚点」可以手动关联别的条目；跳过去之后，用顶部「← 返回」回来。'},
  {t:'第 7 步：两个人一起用',b:'「文件 → 导出文件」发给对方，对方用「导入合并」：同一条内容两边都改过时，保留较新的那份，所以最好分工写不同的条目。\n合并了什么都能在「修改记录」里看到。\n页面太小或太大？⚙ 里可以整页放大缩小。'}
];
let tourI=0;
function openTour(i){tourI=i||0;tourDraw();$('#dlgTour').showModal()}
function tourDraw(){
  const s=TOUR[tourI];
  $('#tourBody').innerHTML=`<h3>${esc(s.t)}</h3>${s.b.split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}${s.btn?`<p><button class="pri" id="tourGo">${esc(s.btn)}</button></p>`:''}`;
  $('#tourDots').innerHTML=TOUR.map((_,i)=>`<span class="td ${i===tourI?'on':''}"></span>`).join('');
  $('#tPrev').disabled=tourI===0;$('#tNext').textContent=tourI===TOUR.length-1?'完成':'下一步';
  const g=$('#tourGo');if(g)g.onclick=()=>s.fn&&s.fn();
}
$('#tPrev').onclick=()=>{if(tourI>0){tourI--;tourDraw()}};
$('#tNext').onclick=()=>{if(tourI<TOUR.length-1){tourI++;tourDraw()}else $('#dlgTour').close()};
$('#dlgTour').onclose=()=>{try{localStorage.setItem('storyplanner.tour','1')}catch(e){}};
function loadSample(){
  if(db.items.some(i=>!i.del)&&!confirm('载入示例会替换当前项目的全部内容。\n建议先用「文件 → 导出文件」备份。继续吗？'))return;
  db=normalize({title:'示例：海边初遇'});
  [selMap,mapCur,bviews,bundo,bchat,TL].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  const text=db.sheets.find(s=>s.kind==='text');
  const T=newItem(text.id,{title:'海边初遇（剧本示例）',body:SAMPLE_SCRIPT});
  const N=newItem(text.id,{title:'创作笔记',body:'随便写灵感的地方。\n小明：内向，爱画画，圈子里叫他夜莺。\n小红：开朗，爱在码头等人。\n一个关于等待与告白的夏天。'});
  newItem('s_char',{title:'小明',aliases:'夜莺',body:'内向，爱画画。夏天转学到海边小镇。常去 海风咖啡馆。',fields:[{k:'年龄',v:'17'},{k:'口头禅',v:'……算了'}]});
  newItem('s_char',{title:'小红',aliases:'红红',body:'开朗，话多，暗中在意 小明。喜欢傍晚的 码头。',fields:[{k:'年龄',v:'17'},{k:'口头禅',v:'喂！'}]});
  const pier=newItem('s_place',{title:'码头',body:'傍晚金色的海面，旧木栈桥。小红常在这里等人。',px:24,py:62,status:'进行中'});
  const cafe=newItem('s_place',{title:'海风咖啡馆',body:'新开的小店：木质吧台，暖黄灯光，靠窗两张小桌。',px:70,py:58,status:'待画'});
  newItem('s_place',{title:'吧台',body:'',parent:cafe.id,px:35,py:55,status:'待画'});
  newItem('s_place',{title:'小镇全景',body:'',px:48,py:22,status:'待画'});
  const ev=(title,when,parent,body)=>newItem('s_event',{title,when,body,parent:parent?parent.id:''});
  const e1=ev('转学','第1天',null,'小明来到海边小镇。'),e2=ev('码头初遇','第3天',e1,'傍晚，在码头遇见小红。');
  const e3=ev('一起去咖啡馆','夏中',e2,'');ev('告白','夏末',e3,'');const e5=ev('误会','夏末',e3,'');ev('雨夜和解','秋天',e5,'');
  const cg=newItem('s_log',{title:'CG：码头初遇',body:'逆光，两人隔着栈桥对视。',fields:[]});
  linkItems(e2,cg);
  genScriptBoard(T,true);
  TL[text.id]={split:true,ratio:.5,left:T.id,right:N.id};saveTL();
  cur=text.id;selMap[text.id]=T.id;save();render();
  toast('已载入示例项目：「文稿」页左边是剧本，右边是创作笔记。右边的下拉框可以改成「▶ 试玩」。',false);
}

// ---------- 整页缩放 ----------
const ZKEY='storyplanner.zoom';let zoom=1;
try{zoom=parseFloat(localStorage.getItem(ZKEY))||1}catch(e){}
function applyZoom(){
  zoom=Math.min(2,Math.max(.5,Math.round(zoom*100)/100));
  const r=document.documentElement.style;r.setProperty('--z',zoom);r.setProperty('--vh',(innerHeight/zoom)+'px');
  try{localStorage.setItem(ZKEY,zoom)}catch(e){}
}
$('#bHelp').onclick=()=>openTour(0);
function newProject(){
  const has=db.items.some(i=>!i.del)||db.board.some(b=>!b.del);
  if(has){
    if(!confirm('新建空白项目：当前内容会被清空。\n\n我会先自动下载一份备份文件（.json），需要时可以用「导入合并」找回。\n继续吗？'))return;
    doExport();
  }
  db=normalize({title:'未命名策划'});
  [selMap,mapCur,bviews,bundo,bchat,TL].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));
  navStack.length=0;updBack();
  cur=db.sheets.slice().sort((a,b)=>a.order-b.order)[0].id;
  save();render();
  toast(has?'已新建空白项目，刚才的内容已备份下载。不会用的话点右上角「？」看教程':'已新建空白项目。不会用的话点右上角「？」看教程',false);
}
const hdrMenu=(btn,items)=>{const r=btn.getBoundingClientRect();showMenu(items,r.left,r.bottom+4)};
$('#bFile').onclick=e=>hdrMenu(e.currentTarget,[
  {t:'新建空白项目（会先自动备份当前的）',f:newProject},{sep:true},{t:'导出文件（发给对方）',f:doExport},{t:'导入合并（收到对方的文件）',f:doImport},{t:'导出策划案文档（.md）',f:doMd},{sep:true},{t:'修改记录',f:openLog}]);
$('#bSet').onclick=e=>hdrMenu(e.currentTarget,[
  {t:'API 设置',f:openApi},{t:'新手教程',f:()=>openTour(0)},{t:'载入示例项目',f:loadSample},{sep:true},
  {t:'页面缩小',f:()=>{zoom-=.1;applyZoom()}},{t:`页面放大（现在 ${Math.round(zoom*100)}%）`,f:()=>{zoom+=.1;applyZoom()}},{t:'恢复 100%',f:()=>{zoom=1;applyZoom()}}]);
addEventListener('resize',applyZoom);
applyZoom();

cur=sheets()[0].id;render();
try{localStorage.setItem('__probe','1');localStorage.removeItem('__probe')}catch(e){saveOk=false;showSaveBar('这个浏览器 / 打开方式不允许保存：你写的内容只在当前页面里，关掉就没了。请用 Chrome / Edge 直接打开这个文件（不要在预览窗口、隐私窗口里用），并先点「文件 → 导出文件」备份。')}
try{if(!localStorage.getItem('storyplanner.tour')&&!db.items.some(i=>!i.del))openTour(0)}catch(e){}
</script>
